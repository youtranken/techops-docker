<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechOps · Mật khẩu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- Trang xác thực (không shell) — cùng bố cục với login.html ---------- */
.au{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:56px 16px 96px}
.au-col{width:100%;max-width:400px;margin:auto 0}
.au-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 24px;text-decoration:none}
.au-card{padding:28px}
.au-card h1{margin:0 0 6px;font:600 var(--fs-xl)/1.3 var(--f-head);letter-spacing:-.015em}
.au-lead{margin:0 0 22px;color:var(--ink-2)}
.au-lead .mono{color:var(--ink);font-size:13px}
.au-card .note{margin:0 0 20px}
.pw{position:relative}
.pw .input{padding-right:44px}
.pw .icon-btn{position:absolute;right:1px;top:1px;width:36px;height:36px}
.au-submit{width:100%;margin-top:24px}
.au-alt{display:flex;justify-content:center;margin-top:14px}
.au-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;margin-top:20px;font-size:var(--fs-xs);color:var(--ink-3)}
.au-foot .btn{height:30px;font-size:var(--fs-xs);padding:0 10px;gap:6px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,currentColor 35%,transparent);border-top-color:currentColor;animation:spin .8s linear infinite;flex:none}
.spin.lg{width:32px;height:32px;border-width:3px;color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
/* Checklist chính sách mật khẩu */
.pol{margin:10px 0 0;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface-2)}
.pol-h{font-size:var(--fs-xs);font-weight:500;color:var(--ink-2);margin:0 0 6px}
.pol ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pol li{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--ink-2);line-height:1.5}
.pol li .i{width:14px;height:14px;color:var(--ink-3)}
.pol li.ok{color:var(--ink)}
.pol li.ok .i{color:var(--c-done)}
.pol.bad{box-shadow:inset 0 0 0 1px var(--danger)}
.pol.bad li:not(.ok) .i{color:var(--danger)}
/* Màn kết quả */
.au-res{text-align:center;padding:8px 0 4px}
.au-res .ri{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:var(--surface-2);color:var(--ink-2)}
.au-res .ri .i{width:24px;height:24px}
.au-res .ri.ok{color:var(--c-done);background:color-mix(in srgb,var(--c-done) 12%,var(--surface))}
.au-res .ri.bad{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.au-res .ri.warn{color:var(--c-review);background:color-mix(in srgb,var(--c-review) 12%,var(--surface))}
.au-res h1{font-size:20px}
.au-res p{margin:0 auto;color:var(--ink-2);max-width:320px}
.au-res p b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.au-res .acts{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.au-res .acts .btn{width:100%}
.pv .pvh{font-size:var(--fs-xs);color:var(--ink-3);padding:0 8px;font-family:var(--f-mono)}
@media (max-width:480px){
  .au{padding-top:28px}
  .au-card{padding:22px 18px}
  .au-brand{margin-bottom:20px}
}
</style>
</head>
<body data-no-pvbar>
<main class="au" id="content">
  <div class="au-col">
    <a class="au-brand" href="login.html"><span class="brand-mark"><i data-i="workflow" class="i-sm"></i></span><span class="brand-tx"><b data-t="app.name"></b><small data-t="app.org"></small></span></a>
    <section class="card au-card" id="card" aria-labelledby="auT" aria-live="polite"></section>
    <footer class="au-foot">
      <div class="seg" id="lang" role="group" data-t-label="pv.lang"><button type="button" data-lang="vi" data-t="lang.vi"></button><button type="button" data-lang="en" data-t="lang.en"></button></div>
      <button type="button" class="btn btn-ghost" data-theme-toggle id="themeBtn"></button>
      <span data-t="au.foot"></span>
    </footer>
  </div>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="pv" id="pv" role="toolbar"></div>

<script src="copy.js"></script>
<script src="ds.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function(){
  /* Luật lấy từ V1:
     - first  = src/app/(auth)/change-password (middleware buộc khi mustChangePassword); API /api/settings/profile/change-password:
                WRONG_PASSWORD, SAME_PASSWORD, PASSWORD_POLICY_VIOLATION, giới hạn 5 lần/giờ/người.
     - reset  = src/app/(auth)/reset-password: kiểm tra token trước (/check), hết hạn → ẩn form; thành công → 3 giây về /login.
                Link do Admin/Boss gửi (TTL 15 phút) hoặc link tạo tài khoản (24 giờ).
     - verify = src/app/(auth)/verify-email: success | missing_token | invalid_or_expired | email_changed (TTL 24 giờ).
     - Chính sách: SecurityConfig.passwordPolicy (mặc định 8 ký tự, hoa, thường, số; ký tự đặc biệt tắt) — cấu hình được. */
  var T=I18N.t, esc=App.esc, $=App.$;
  var SP=/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;
  var POL={def:{min:8,up:1,low:1,num:1,sp:0},strict:{min:12,up:1,low:1,num:1,sp:1}};
  var SCN={first:['empty','typing','mismatch','saving','curWrong','ok'],reset:['checking','linkExp','linkBad','linkNet','form','ok'],verify:['vbusy','ok','vmissing','vexpired','vchanged']};
  var DEF={first:'empty',reset:'checking',verify:'vbusy'};
  var qs=new URLSearchParams(location.search);
  var mode=SCN[qs.get('mode')]?qs.get('mode'):'first';
  var S={scn:"",cur:"",nw:"",cf:"",show:{},err:{}}, pol="def", redirect=null, auto=null;
  var USER='leminh', EMAIL='leminh@pmh.com.vn';

  function blank(scn){return {scn:scn,cur:'',nw:'',cf:'',show:{cur:false,nw:false},busy:false,err:{},polBad:false,done:false,count:3}}
  function checks(pw){
    var p=POL[pol], r=[{k:'len',t:T('au.pol.len',{n:p.min}),ok:pw.length>=p.min}];
    if(p.up)r.push({t:T('au.pol.up'),ok:/[A-Z]/.test(pw)});
    if(p.low)r.push({t:T('au.pol.low'),ok:/[a-z]/.test(pw)});
    if(p.num)r.push({t:T('au.pol.num'),ok:/[0-9]/.test(pw)});
    if(p.sp)r.push({t:T('au.pol.sp'),ok:SP.test(pw)});
    return r;
  }
  function allOk(pw){return checks(pw).every(function(c){return c.ok})}
  function polHtml(){
    var c=checks(S.nw), x=c.filter(function(i){return i.ok}).length;
    return '<div class="pol'+(S.polBad?' bad':'')+'" id="pol"><p class="pol-h" id="polH">'+esc(T('au.pol.title'))+'</p><ul aria-labelledby="polH">'+c.map(function(i){
      return '<li'+(i.ok?' class="ok"':'')+'>'+ic(i.ok?'check-circle':'circle')+'<span>'+esc(i.t)+'</span><span class="sr">, '+esc(T(i.ok?'au.pol.met':'au.pol.unmet'))+'</span></li>';
    }).join('')+'</ul><span class="sr" aria-live="polite" id="polN">'+esc(T('au.pol.count',{x:x,n:c.length}))+'</span></div>';
  }
  function errP(id){var m=S.err[id];return '<p class="err" id="'+id+'E"'+(m?'':' hidden')+'>'+(m?ic('alert','i-xs')+'<span>'+esc(m)+'</span>':'')+'</p>'}
  function pwField(id,label,val,ac,eye,extra){
    var dis=S.busy?' disabled':'', inv=S.err[id]?' aria-invalid="true"':'', sh=eye&&S.show[id];
    return '<div class="field"><label class="lbl" for="'+id+'">'+esc(label)+'</label><div class="pw"><input class="input" id="'+id+'" type="'+(sh?'text':'password')+'" autocomplete="'+ac+'" value="'+esc(val)+'" aria-describedby="'+id+'E'+(id==='nw'?' polH':'')+'"'+inv+dis+'>'+
      (eye?'<button type="button" class="icon-btn" data-eye="'+id+'" aria-pressed="'+!!sh+'" aria-label="'+esc(T(sh?'au.hide':'au.show'))+'"'+dis+'>'+ic(sh?'eye-off':'eye','i-sm')+'</button>':'')+'</div>'+errP(id)+(extra||'')+'</div>';
  }
  function res(icon,tone,title,desc,acts){
    return '<div class="au-res">'+(tone==='busy'?'<div class="ri"><span class="spin lg" aria-hidden="true"></span></div>':'<div class="ri '+tone+'">'+ic(icon)+'</div>')+
      '<h1 id="auT">'+esc(title)+'</h1><p>'+desc+'</p>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>';
  }
  function aBtn(href,key,primary,icon){return '<a class="btn btn-lg'+(primary?' btn-p':'')+'" href="'+href+'">'+(icon?ic(icon,'i-sm'):'')+'<span>'+esc(T(key))+'</span></a>'}

  function formHtml(){
    var first=mode==='first';
    return '<h1 id="auT">'+esc(T(first?'au.first.t':'au.reset.t'))+'</h1>'+
      '<p class="au-lead">'+(first?esc(T('au.first.d')):App.fill('au.reset.d',{u:'<span class="mono">'+esc(USER)+'</span>'}))+'</p>'+
      (S.err.form?'<div class="note bad" role="alert">'+ic('alert','i-sm')+'<div>'+esc(S.err.form)+'</div></div>':'')+
      '<form id="f" novalidate>'+
        (first?pwField('cur',T('au.cur'),S.cur,'current-password',true):'')+
        pwField('nw',T('au.new'),S.nw,'new-password',true,polHtml())+
        pwField('cf',T('au.new2'),S.cf,'new-password',false)+
        '<button type="submit" class="btn btn-p btn-lg au-submit" id="go"'+(S.busy?' disabled':'')+'>'+(S.busy?'<span class="spin" aria-hidden="true"></span><span>'+esc(T('au.saving'))+'</span>':'<span>'+esc(T(first?'au.first.btn':'au.reset.btn'))+'</span>')+'</button>'+
      '</form>'+(first?'<div class="au-alt"><a class="btn-link" href="login.html">'+ic('logout','i-xs')+'<span>'+esc(T('au.signout'))+'</span></a></div>':'');
  }
  function render(focus){
    var sc=S.scn, h;
    if(mode==='verify'){
      if(sc==='vbusy')h=res('','busy',T('au.vf.busy.t'),esc(T('au.vf.busy.d')));
      else if(sc==='ok')h=res('check-circle','ok',T('au.vf.ok.t'),App.fill('au.vf.ok.d',{e:'<b>'+esc(EMAIL)+'</b>'}),aBtn('tasks-list.html','au.toTasks',1));
      else if(sc==='vmissing')h=res('x-circle','bad',T('au.vf.missing.t'),esc(T('au.vf.missing.d')),aBtn('tasks-list.html','au.toTasks',1));
      else if(sc==='vexpired')h=res('clock','warn',T('au.vf.expired.t'),esc(T('au.vf.expired.d')),aBtn('tasks-list.html','au.toTasks',1));
      else h=res('mail','warn',T('au.vf.changed.t'),esc(T('au.vf.changed.d')),aBtn('tasks-list.html','au.toTasks',1));
    } else if(mode==='reset'&&sc==='checking')h=res('','busy',T('au.check'),'');
    else if(mode==='reset'&&sc==='linkExp')h=res('clock','warn',T('au.link.exp.t'),esc(T('au.link.exp.d')),aBtn('login.html','au.toLogin',1));
    else if(mode==='reset'&&sc==='linkBad')h=res('x-circle','bad',T('au.link.bad.t'),esc(T('au.link.bad.d')),aBtn('login.html','au.toLogin',1));
    else if(mode==='reset'&&sc==='linkNet')h=res('wifi-off','bad',T('au.link.net.t'),esc(T('au.link.net.d')),'<button type="button" class="btn btn-p btn-lg" id="retry">'+ic('refresh','i-sm')+'<span>'+esc(T('app.retry'))+'</span></button>'+aBtn('login.html','au.toLogin'));
    else if(sc==='ok'&&mode==='reset')h=res('check-circle','ok',T('au.reset.ok.t'),'<span id="cdTx">'+esc(T('au.reset.ok.d',{n:S.count}))+'</span>',aBtn('login.html','au.toLogin',1));
    else if(sc==='ok')h=res('check-circle','ok',T('au.first.ok.t'),esc(T('au.first.ok.d')),aBtn('tasks-list.html','au.toTasks',1,'chev-r'));
    else h=formHtml();
    var p=h.indexOf('<p></p>'); if(p>-1)h=h.replace('<p></p>','');
    $('#card').innerHTML=h;
    if(focus){var el=$(focus);if(el)el.focus();}
    var tk=mode==='verify'?'au.mode.verify':mode==='reset'?'au.reset.t':'au.first.t';
    document.title=T('app.name')+' · '+T(tk);
  }
  function sync(){['cur','nw','cf'].forEach(function(k){var el=$('#'+k);if(el)S[k]=el.value})}
  function clearTimers(){if(redirect){clearInterval(redirect);redirect=null;}if(auto){clearTimeout(auto);auto=null;}}

  function apply(scn,fromLoad){
    clearTimers(); S=blank(scn);
    if(scn==='typing'){S.cur='Pmh@2025';S.nw='minh20';S.cf='';}
    if(scn==='mismatch'){S.cur='Pmh@2025';S.nw='Minhle2026';S.cf='Minhle2025';S.err.cf=T('au.err.match');}
    if(scn==='saving'){S.cur='Pmh@2025';S.nw='Minhle2026';S.cf='Minhle2026';S.busy=true;}
    if(scn==='curWrong'){S.cur='';S.nw='Minhle2026';S.cf='Minhle2026';S.err.cur=T('au.err.cur');}
    if(mode==='reset'&&scn==='form'){S.nw='';}
    render();
    /* Lần đầu mở trang: mô phỏng kiểm tra link / xác nhận rồi chuyển sang kết quả bình thường */
    if(fromLoad&&mode==='reset'&&scn==='checking')auto=setTimeout(function(){apply('form');refreshPv();},1100);
    if(fromLoad&&mode==='verify'&&scn==='vbusy')auto=setTimeout(function(){apply('ok');refreshPv();},1100);
  }
  function validate(){
    var e={}, first=mode==='first';
    if(first&&!S.cur)e.cur=T('au.cur.req');
    if(!S.nw)e.nw=T('au.new.req'); else if(!allOk(S.nw))e.nw=T('au.err.policy');
    if(!S.cf)e.cf=T('au.new2.req'); else if(S.nw&&S.cf!==S.nw)e.cf=T('au.err.match');
    S.err=e; S.polBad=!!(S.nw&&!allOk(S.nw));
    return ['cur','nw','cf'].filter(function(k){return e[k]})[0];
  }
  function submit(){
    sync(); if(S.busy)return;
    var bad=validate(); if(bad){render('#'+bad);return;}
    S.busy=true; render();
    setTimeout(function(){
      S.busy=false;
      if(mode==='first'&&S.cur.toLowerCase()==='sai'){S.cur='';S.err={cur:T('au.err.cur')};render('#cur');return;}  /* WRONG_PASSWORD */
      if(mode==='first'&&S.cur===S.nw){S.err={nw:T('au.err.same')};render('#nw');return;}                       /* SAME_PASSWORD */
      S.scn='ok'; render('#auT'); refreshPv();
      if(mode==='reset'){S.count=3;redirect=setInterval(function(){S.count--;var c=$('#cdTx');if(c)c.textContent=T('au.reset.ok.d',{n:Math.max(0,S.count)});if(S.count<=0){clearTimers();location.href='login.html';}},1000);}
    },900);
  }
  /* Checklist cập nhật trực tiếp khi gõ (không dựng lại form để giữ con trỏ) */
  function livePol(){
    var p=$('#pol'); if(!p)return;
    var bad=S.polBad&&S.nw&&!allOk(S.nw); S.polBad=bad;
    var tmp=document.createElement('div'); tmp.innerHTML=polHtml(); p.replaceWith(tmp.firstChild);
  }
  function setErr(id,m){S.err[id]=m;var i=$('#'+id),e=$('#'+id+'E');if(!i||!e)return;if(m)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid');e.hidden=!m;e.innerHTML=m?ic('alert','i-xs')+'<span>'+esc(m)+'</span>':'';}

  function refreshPv(){
    var sc=SCN[mode], cur=S.scn, showPol=mode!=='verify';
    $('#pv').innerHTML='<a href="index.html">'+ic('grid','i-sm')+'<span>'+esc(T('pv.index'))+'</span></a><span class="pv-sep"></span>'+
      '<label class="pvl" for="pvMode">'+esc(T('au.pv.mode'))+'</label><select id="pvMode">'+['first','reset','verify'].map(function(m){return '<option value="'+m+'"'+(m===mode?' selected':'')+'>'+esc(T('au.mode.'+m))+'</option>'}).join('')+'</select>'+
      '<label class="pvl" for="pvScn">'+esc(T('au.pv.scn'))+'</label><select id="pvScn">'+sc.map(function(k){var key=k==='ok'?'au.scn.ok':'au.scn.'+k;return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(T(key))+'</option>'}).join('')+'</select>'+
      (showPol?'<label class="pvl" for="pvPol">'+esc(T('au.pv.policy'))+'</label><select id="pvPol"><option value="def"'+(pol==='def'?' selected':'')+'>'+esc(T('au.pv.polDef'))+'</option><option value="strict"'+(pol==='strict'?' selected':'')+'>'+esc(T('au.pv.polStrict'))+'</option></select>':'');
    $('#pv').setAttribute('aria-label',T('app.pv.label'));
  }
  function chrome(){
    I18N.apply(document); refreshPv();
    App.$$('#lang [data-lang]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===I18N.lang)});
    var dark=document.documentElement.getAttribute('data-theme')==='dark', k=dark?'pv.light':'pv.dark';
    $('#themeBtn').innerHTML=ic(dark?'sun':'moon','i-xs')+'<span>'+esc(T(k))+'</span>';
    $('#themeBtn').setAttribute('aria-label',T('au.theme')+': '+T(k));
  }
  function url(){history.replaceState(null,'','?mode='+mode+'&s='+S.scn)}

  document.addEventListener('submit',function(e){if(e.target.id==='f'){e.preventDefault();submit();}});
  document.addEventListener('click',function(e){
    var el;
    if((el=e.target.closest('[data-eye]'))){sync();var k=el.dataset.eye;S.show[k]=!S.show[k];render('[data-eye="'+k+'"]');return;}
    if(e.target.closest('#retry')){S.scn='checking';render();auto=setTimeout(function(){apply('form');refreshPv();$('#nw').focus();},900);return;}
    if((el=e.target.closest('#lang [data-lang]'))){sync();I18N.setLang(el.dataset.lang);return;}
  });
  document.addEventListener('input',function(e){
    var id=e.target.id; if(['cur','nw','cf'].indexOf(id)<0)return;
    S[id]=e.target.value;
    if(id==='cur'&&S.err.cur)setErr('cur','');
    if(id==='nw'){livePol(); if(S.err.nw&&(S.nw&&allOk(S.nw)||S.err.nw===T('au.new.req')&&S.nw||S.err.nw===T('au.err.same')))setErr('nw','');}
    if((id==='cf'||id==='nw')&&S.err.cf&&S.cf&&S.cf===S.nw)setErr('cf','');
  });
  document.addEventListener('focusout',function(e){ /* báo không khớp khi rời ô nhập lại */
    if(e.target.id==='cf'&&S.cf&&S.nw&&S.cf!==S.nw)setErr('cf',T('au.err.match'));
  });
  document.addEventListener('change',function(e){
    var id=e.target.id;
    if(id==='pvMode'){mode=e.target.value;apply(DEF[mode]);url();refreshPv();$('#pvMode').focus();return;}
    if(id==='pvScn'){apply(e.target.value);url();refreshPv();$('#pvScn').focus();return;}
    if(id==='pvPol'){sync();pol=e.target.value;if(S.polBad)S.polBad=!!(S.nw&&!allOk(S.nw));render();refreshPv();$('#pvPol').focus();return;}
  });
  document.addEventListener('langchange',function(){
    sync(); var cur=S.scn; /* dịch lại thông báo lỗi đang hiện */
    if(S.err.cur||S.err.nw||S.err.cf){var keep=S.err;S.err={};if(keep.cur)S.err.cur=T(S.cur?'au.err.cur':'au.cur.req');if(keep.nw)S.err.nw=T(!S.nw?'au.new.req':allOk(S.nw)?'au.err.same':'au.err.policy');if(keep.cf)S.err.cf=T(S.cf?'au.err.match':'au.new2.req');}
    S.scn=cur; render(); chrome();
  });
  new MutationObserver(chrome).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  document.addEventListener('DOMContentLoaded',function(){
    var s=qs.get('s'); var start=SCN[mode].indexOf(s)>-1?s:DEF[mode];
    S=blank(start); chrome(); apply(start,!s);
  });
})();
</script>
</body>
</html>
