<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechOps · Nhật ký</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- Riêng trang Nhật ký ---------- */
.lg-ctl{border-bottom:1px solid var(--line);margin-bottom:16px}
.lg-fb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.lg-fb .lg-q{width:240px}
.lg-sel{display:block;min-width:0}
.lg-fb .select{height:34px;font-size:var(--fs-sm);width:auto;max-width:210px;border-color:var(--line)}
.lg-fb .btn-q[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.lg-fb .btn-q[aria-pressed="true"] .i{color:var(--primary)}
.lg-fb .btn-link{height:34px}
.lg-dates{display:flex;align-items:center;gap:6px;min-width:0}
.lg-dates .input{height:34px;width:148px;min-width:0;font-size:var(--fs-sm);padding:0 8px;border-color:var(--line)}
/* Phase B (tạm, chờ app.css có .pb-zone) */
.pb-zone{outline:1px dashed color-mix(in srgb,var(--amber) 70%,transparent);outline-offset:2px;border-radius:var(--r-sm)}
.phase-b.pb-s{height:16px;padding:0 4px;margin-left:4px}
.lg-fb .pbw{display:inline-flex;align-items:center;min-width:0;border-radius:var(--r-ctl)}
.lg-sec.pb-zone{padding:4px 6px}
.lg-sec h4 .lg-meta{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:var(--fs-sm);color:var(--ink-3);min-height:20px}
.lg-meta b{color:var(--ink);font-weight:600}
.lg-hint{margin:0 0 12px;font-size:var(--fs-sm);color:var(--ink-3)}

/* bảng */
.lg-task{--cols:52px 150px 180px minmax(0,1fr) minmax(0,.85fr) 16px}
.lg-user{--cols:52px 168px 200px minmax(0,1fr) 172px 16px}
.lg-ref{--cols:112px minmax(0,1fr) 214px 140px 64px 16px}
.lg-day{display:flex;align-items:center;gap:8px;height:34px;padding:0 20px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:var(--fs-xs);font-weight:500;color:var(--ink-2)}
.lg-day .mono{color:var(--ink-3);font-weight:400}
.lg-tbl .tr{min-height:44px}
.lg-tbl .th{font:400 var(--fs-xs)/1 var(--f-body);color:var(--ink-3)}
.c-time{font:400 13px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.c-who{gap:8px;font-size:var(--fs-sm);color:var(--ink)}
.c-who .nm,.c-act .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-act{gap:8px;font-size:var(--fs-sm);color:var(--ink)}
.c-act .i{flex:none}
.lg-alert{color:var(--danger)}
.g-create{--k:var(--c-draft)} .g-flow{--k:var(--c-progress)} .g-done{--k:var(--c-done)} .g-ext{--k:var(--c-review)} .g-neg{--k:var(--danger)}
.g-session{--k:var(--c-pickup)} .g-alert{--k:var(--danger)} .g-account{--k:var(--c-approval)} .g-system{--k:var(--c-draft)}
.c-obj{flex-direction:column;align-items:stretch;justify-content:center;gap:2px}
.ol{display:flex;align-items:baseline;gap:8px;min-width:0}
.code{font:500 12px/1.4 var(--f-mono);color:var(--ink-2);text-decoration:none;flex:none;white-space:nowrap}
a.code{border-radius:4px}
a.code:hover{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.ot{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ot.gone{color:var(--ink-3)}
.lg-chg{display:flex;align-items:center;gap:6px;min-width:0;font-size:var(--fs-sm);color:var(--ink-2)}
.lg-chg .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lg-chg .mute{color:var(--ink-3)}
.o-chg{display:none;font-size:var(--fs-xs)}
.lg-more{flex:none;font:500 11px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:3px 4px}
.ar{color:var(--ink-3)}
.c-chev{color:var(--ink-3);justify-content:flex-end}
.tr:hover .c-chev{color:var(--ink-2)}
/* người dùng */
.av.unk{background:var(--surface-2);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.who2{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.who2 small{font:400 11px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-det{font-size:var(--fs-sm);color:var(--ink-2)}
.c-det .tx,.a-det{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.a-det{display:none;font-size:var(--fs-xs);color:var(--ink-3)}
.act2{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.c-src{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;font-size:var(--fs-xs);line-height:1.35}
.c-src .ip{font:400 12px/1.35 var(--f-mono);color:var(--ink-2)}
.ipk{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);white-space:nowrap}
.ipk.out{color:var(--ink-2)}
.ipk.out .i{color:var(--c-review)}
/* tra cứu mã */
.c-code,.c-id{gap:2px}
.c-code .code{font-size:13px;color:var(--ink)}
.c-id .mono{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-title{flex-direction:column;align-items:stretch;justify-content:center;gap:2px}
.c-title .tt{font-size:var(--fs-md);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-title .stat{font-size:var(--fs-xs);gap:6px}
.c-title .stat .sdot{width:7px;height:7px}
.lg-exact{color:var(--primary);font-weight:500}
.c-date{font:400 12px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.c-cr{gap:8px;font-size:var(--fs-sm)}
.c-cr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* trạng thái trong bảng */
.lg-tbl .state .acts{margin-top:16px}
/* phân trang */
.lg-pg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:var(--fs-sm);color:var(--ink-3)}
.lg-pg .mono{color:var(--ink-2)}
.pgs{display:flex;align-items:center;gap:2px}
.lg-pb{min-width:32px;height:32px;padding:0 6px;border:1px solid transparent;border-radius:var(--r-ctl);background:transparent;font:500 13px/1 var(--f-mono);color:var(--ink-2)}
.lg-pb:hover{background:var(--surface-2);color:var(--ink)}
.lg-pb[aria-current="page"]{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
/* ngăn chi tiết */
.lg-drt{flex:1;margin:0 0 0 4px;font:600 15px/1.3 var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-dh{margin:0 0 18px}
.lg-dh .stat{font-size:var(--fs-sm);color:var(--ink)}
.lg-dh h3{margin:8px 0 0;font:600 var(--fs-lg)/1.4 var(--f-head);letter-spacing:-.01em;overflow-wrap:anywhere}
.lg-dh h3 .code{font-size:14px;margin-right:6px;color:var(--ink-2)}
.lg-dh h3 a.code{color:var(--primary)}
.dr-b .kv1>div{grid-template-columns:116px minmax(0,1fr)}
.kv1 dd .mono{font-size:var(--fs-sm)}
.kv1 dd .sub{color:var(--ink-3);font-size:var(--fs-xs)}
.lg-sec{margin-top:24px}
.lg-sec h4{margin:0 0 8px;font:600 var(--fs-sm)/1.4 var(--f-body);color:var(--ink)}
.lg-ct{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs-sm)}
.lg-ct th{text-align:left;font-weight:500;font-size:var(--fs-xs);color:var(--ink-3);padding:0 10px 6px 0;border-bottom:1px solid var(--line)}
.lg-ct td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;color:var(--ink)}
.lg-ct td:first-child{color:var(--ink-2)}
.lg-ct td.o{color:var(--ink-3)}
.lg-ct .stat{white-space:normal;font-size:var(--fs-sm);color:inherit}
.lg-ct .ppl{display:flex;flex-wrap:wrap;gap:4px 10px}
.lg-ct .ppl span{display:inline-flex;align-items:center;gap:6px}
.lg-quote{margin:0;padding:10px 12px;border-left:3px solid var(--line-2);background:var(--surface-2);border-radius:0 var(--r-ctl) var(--r-ctl) 0;font-size:var(--fs-md);line-height:1.55;color:var(--ink);overflow-wrap:anywhere}
.lg-ua summary{cursor:pointer;font-size:var(--fs-sm);color:var(--ink-2);width:max-content;max-width:100%;border-radius:4px}
.lg-ua summary:hover{color:var(--ink)}
.lg-ua p{margin:8px 0 0;font:400 12px/1.55 var(--f-mono);color:var(--ink-3);overflow-wrap:anywhere}
.lg-evid{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-3)}
.lg-evid .mono{color:var(--ink-2);overflow-wrap:anywhere}
.lg-idrow{display:flex;align-items:center;gap:2px;min-width:0}
.lg-idrow .mono{overflow-wrap:anywhere;min-width:0}
.dr-f .sp{flex:1}

@media (max-width:1023px){
  .thead,.tr{column-gap:16px;padding:0 12px 0 16px}
  .lg-day{padding:0 16px}
  .lg-task{--cols:46px 132px 168px minmax(0,1fr) 16px}
  .lg-task .c-chg{display:none}
  .lg-task .o-chg{display:flex}
  .lg-user{--cols:46px 150px minmax(0,1fr) 160px 16px}
  .lg-user .c-det{display:none}
  .lg-user .a-det{display:block}
  .lg-ref{--cols:108px minmax(0,1fr) 200px 76px 16px}
  .lg-ref .c-cr{display:none}
}
@media (max-width:680px){
  .lg-ctl .tabs{gap:18px;margin:0 -16px;padding:0 16px}
  .lg-fb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .lg-fb .lg-q,.lg-fb .pbw.q{grid-column:1/-1;width:auto}
  .lg-fb .pbw .lg-q{flex:1}
  .lg-dates{grid-column:1/-1}
  .lg-dates .input{flex:1;width:auto}
  .lg-fb .select{max-width:none;width:100%}
  .lg-fb .btn-q{justify-content:center}
  .lg-fb .btn-link{justify-self:start}
  .lg-tbl .tr{padding:12px 16px;row-gap:4px}
  .lg-task .c-act{order:1;flex:1 1 0;min-width:0}
  .lg-task .c-time{order:2;margin-left:auto}
  .lg-task .c-obj{order:3}
  .lg-task .o-chg{display:none}
  .lg-task .c-who{order:4;flex:none;max-width:45%;font-size:var(--fs-xs)}
  .lg-task .c-chg{order:5;display:flex;flex:1 1 0;min-width:0;font-size:var(--fs-xs);color:var(--ink-3)}
  .lg-user .c-act{order:1;flex:1 1 60%;min-width:0}
  .lg-user .a-det{display:none}
  .lg-user .c-time{order:2;margin-left:auto}
  .lg-user .c-who{order:3;flex:1 1 40%;min-width:0;font-size:var(--fs-xs)}
  .lg-user .c-src{order:4;flex:none;align-items:flex-end;text-align:right}
  .lg-user .c-det{order:5;display:flex;flex:1 1 100%;font-size:var(--fs-xs);color:var(--ink-3)}
  .lg-ref .c-code{order:1}
  .lg-ref .c-date{order:2;margin-left:auto}
  .lg-ref .c-title{order:3}
  .lg-ref .c-id{order:4;flex:1 1 100%}
  .c-who .av{width:20px;height:20px;font-size:9px}
  .lg-pg{flex-wrap:wrap}
  .pgs .lg-pb{display:none}
  .lg-drt{font-size:14px}
  .dr-f .sp{display:none}
  .dr-b .kv1>div{grid-template-columns:96px minmax(0,1fr)}
  .lg-ct th:first-child,.lg-ct td:first-child{width:30%}
}
</style>
</head>

  function opt(v,label,cur){return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(label)+'</option>'}
  function sel(id,labelKey,inner){return '<label class="lg-sel"><span class="sr">'+esc(T(labelKey))+'</span><select class="select" id="'+id+'" data-f title="'+esc(T(labelKey))+'">'+inner+'</select></label>'}
  function dateRange(f){
    return '<span class="lg-dates"><label class="sr" for="fa">'+esc(T('lg.f.from'))+'</label><input class="input" type="date" id="fa" data-f value="'+esc(f.a)+'" max="'+TODAY+'" title="'+esc(T('lg.f.from'))+'"'+(f.b?' data-max="'+f.b+'"':'')+'>'+
      '<span class="faint" aria-hidden="true">–</span><label class="sr" for="fb">'+esc(T('lg.f.to'))+'</label><input class="input" type="date" id="fb" data-f value="'+esc(f.b)+'" max="'+TODAY+'" title="'+esc(T('lg.f.to'))+'"></span>';
  }
  function whoSel(f,all,unk){return sel('fwho',S.tab==='ref'?'lg.f.creator':'lg.f.who',opt('',T(all),f.who)+(unk?opt('UNKNOWN',T('lg.f.unknown'),f.who):'')+DATA.USERS.map(function(c){return opt(c,nm(c),f.who)}).join(''))}
  function actSel(f,G,pre){
    return sel('fact','lg.f.act',opt('',T('lg.f.actAll'),f.act)+Object.keys(G).map(function(g){
      return '<optgroup label="'+esc(T('lg.g.'+g))+'">'+G[g].map(function(a){return opt(a,T(pre+a),f.act)}).join('')+'</optgroup>'}).join(''));
  }
  function filters(){
    var f=S.f[S.tab], boss=priv(), qk=S.tab==='task'?'lg.f.qTask':S.tab==='user'?'lg.f.qUser':'lg.f.qRef';
    var qbox='<label class="search lg-q">'+ic('search','i-sm')+'<span class="sr">'+esc(T(qk))+'</span>'+
      '<input type="search" id="fq" value="'+esc(f.q)+'" placeholder="'+esc(T(qk))+'" autocomplete="off" spellcheck="false"></label>';
    var h='<div class="lg-fb" role="search" aria-label="'+esc(T('lg.f.label'))+'">'+(S.tab==='user'?'<span class="pbw q pb-zone" title="'+esc(T('lg.pb.uq'))+'">'+qbox+pb(1)+'</span>':qbox);
    if(S.tab==='task')h+=dateRange(f)+(boss?whoSel(f,'lg.f.whoAll'):'')+actSel(f,TG,'lg.a.');
    else if(S.tab==='user')h+=dateRange(f)+(boss?whoSel(f,'lg.f.whoAll',1):'')+actSel(f,UG,'lg.u.')+
      sel('fip','lg.f.ip',opt('',T('lg.f.ipAll'),f.ip)+opt('internal',T('lg.ip.internal'),f.ip)+opt('external',T('lg.ip.external'),f.ip))+
      '<button type="button" class="btn btn-q pb-zone" id="falert" aria-pressed="'+!!f.alert+'" title="'+esc(T('lg.pb.alert'))+'">'+ic('alert','i-xs')+'<span>'+esc(T('lg.f.alerts'))+'</span>'+pb(1)+'</button>';
    else h+=whoSel(f,'lg.f.creatorAll');
    return h+'<button type="button" class="btn-link" id="fclear"'+(hasF()?'':' hidden')+'>'+esc(T('lg.f.clear'))+'</button></div>';
  }
  var COLS={
    task:[['c-time','lg.col.time'],['c-who','lg.col.who'],['c-act','lg.col.act'],['c-obj td-main','lg.col.obj'],['c-chg','lg.col.chg'],['td-hide c-chev','']],
    user:[['c-time','lg.col.time'],['c-who','lg.col.user'],['c-act','lg.col.act'],['c-det','lg.col.detail'],['c-src','lg.col.src'],['td-hide c-chev','']],
    ref:[['c-code','lg.col.code'],['c-title td-main','lg.col.title'],['c-id','lg.col.id'],['c-cr','lg.col.creator'],['c-date','lg.col.created'],['td-hide c-chev','']]
  };
  function thead(){return COLS[S.tab].map(function(c){return '<div class="th '+c[0].replace('td-main','').replace('td-hide','')+'" role="columnheader">'+(c[1]?esc(T(c[1]==='lg.col.creator'?'lg.f.creator':c[1])):'<span class="sr">'+esc(T('lg.row.open'))+'</span>')+'</div>'}).join('')}
  function dayLabel(d){
    var y=DATA.addDays(TODAY,-1);
    return d===TODAY?'<span>'+esc(T('lg.day.today'))+'</span><span class="mono">'+esc(App.dt(d,true))+'</span>'
      :d===y?'<span>'+esc(T('lg.day.yday'))+'</span><span class="mono">'+esc(App.dt(d,true))+'</span>':'<span class="mono">'+esc(App.dt(d))+'</span>';
  }
  var CHEV='<div class="td td-hide c-chev" role="cell" aria-hidden="true">'+ic('chev-r','i-sm')+'</div>';
  function rowTask(e){
    var items=tItems(e), tt=tTitle(e.t), lab=T(tLabel(e));
    return '<div class="tr" role="row" tabindex="0" aria-haspopup="dialog" data-ev="'+e.id+'" aria-label="'+esc(hm(e.w)+' · '+nm(e.by)+' · '+lab+' · '+e.t)+'">'+
      '<div class="td c-time" role="cell">'+hm(e.w)+'</div>'+
      '<div class="td c-who" role="cell">'+av(e.by)+'<span class="nm">'+esc(nm(e.by))+'</span></div>'+
      '<div class="td c-act g-'+e.g+'" role="cell">'+actCell(e.g,lab)+'</div>'+
      '<div class="td td-main c-obj" role="cell"><div class="ol">'+codeLink(e.t)+'<span class="ot" title="'+esc(tt)+'">'+esc(tt)+'</span></div><div class="lg-chg o-chg">'+summary(items)+'</div></div>'+
      '<div class="td c-chg lg-chg" role="cell">'+summary(items)+'</div>'+CHEV+'</div>';
  }
  function rowUser(e){
    var lab=T('lg.u.'+e.a), det=uDetail(e), alert=e.g==='alert';
    return '<div class="tr" role="row" tabindex="0" aria-haspopup="dialog" data-ev="'+e.id+'" aria-label="'+esc(hm(e.w)+' · '+(e.u?nm(e.u):T('lg.unknown'))+' · '+lab+(e.it==='external'?' · '+T('lg.ip.external'):''))+'">'+
      '<div class="td c-time" role="cell">'+hm(e.w)+'</div>'+
      '<div class="td c-who" role="cell">'+uWho(e)+'</div>'+
      '<div class="td c-act g-'+e.g+'" role="cell">'+(alert?ic('alert','i-sm lg-alert'):'<span class="sdot" aria-hidden="true"></span>')+'<span class="act2"><span class="lb">'+esc(lab)+'</span><span class="a-det">'+esc(det)+'</span></span></div>'+
      '<div class="td c-det" role="cell"><span class="tx" title="'+esc(det)+'">'+esc(det)+'</span></div>'+
      '<div class="td c-src" role="cell"><span class="ip">'+esc(e.ip)+'</span>'+ipMark(e)+'</div>'+CHEV+'</div>';
  }
  function rowRef(r){
    var q=S.f.ref.q.trim().toLowerCase(), exact=q&&(q===r.code.toLowerCase()||q===r.uid), tt=tTitle(r.code);
    return '<div class="tr" role="row" tabindex="0" aria-haspopup="dialog" data-ref="'+r.code+'" aria-label="'+esc(r.code+' · '+tt)+'">'+
      '<div class="td c-code" role="cell">'+codeLink(r.code)+copyBtn(r.code)+'</div>'+
      '<div class="td td-main c-title" role="cell"><span class="tt" title="'+esc(tt)+'">'+esc(tt)+'</span><span class="ol">'+stat(r.s)+(exact?'<span class="lg-exact">· '+esc(T('lg.ref.exact'))+'</span>':'')+'</span></div>'+
      '<div class="td c-id" role="cell"><span class="mono" title="'+r.uid+'">'+r.uid+'</span>'+copyBtn(r.uid)+'</div>'+
      '<div class="td c-cr" role="cell">'+av(r.cr)+'<span class="nm">'+esc(nm(r.cr))+'</span></div>'+
      '<div class="td c-date" role="cell">'+esc(App.dt(r.at,true))+'</div>'+CHEV+'</div>';
  }
  function skRows(){
    var w=[[34,96,120,220,150],[34,80,100,260,120],[34,110,140,200,170]], h='';
    for(var i=0;i<8;i++){var x=w[i%3];
      h+='<div class="tr" role="row" aria-hidden="true">'+COLS[S.tab].map(function(c,j){
        return '<div class="td '+c[0]+'" role="cell">'+(j===5?'':'<span class="sk line" style="width:'+Math.min(x[j%5],j===0?40:400)+'px;max-width:100%"></span>')+'</div>'}).join('')+'</div>';}
    return h;
  }
  function body(){
    var f=S.f[S.tab];
    if(S.screen==='loading')return {html:skRows(),meta:'<span class="sk line" style="width:120px"></span>',pg:''};
    if(S.screen==='error')return {html:'<div class="state bad" role="alert">'+ic('wifi-off')+'<b>'+esc(T('lg.ne.t'))+'</b><span>'+esc(T('lg.ne.d'))+'</span><div class="acts"><button type="button" class="btn btn-p" data-retry>'+ic('refresh','i-sm')+'<span>'+esc(T('app.retry'))+'</span></button></div></div>',meta:'',pg:''};
    var r=rows(), n=r.length, pages=Math.max(1,Math.ceil(n/PG));
    if(f.pg>pages)f.pg=pages;
    var meta='<span>'+App.fill(S.tab==='ref'?'lg.countRef':'lg.count',{n:'<b class="mono">'+n+'</b>'})+'</span>'+(S.tab!=='ref'&&(f.a||f.b)?'<span aria-hidden="true">·</span><span class="mono">'+esc((f.a?App.dt(f.a,true):'…')+' – '+(f.b?App.dt(f.b,true):'…'))+'</span>':'');
    if(!n)return {html:'<div class="state" role="status">'+ic('filter')+'<b>'+esc(T(S.tab==='ref'?'lg.nm.tRef':'lg.nm.t'))+'</b><span>'+esc(T('lg.nm.d'))+'</span>'+(hasF()?'<div class="acts"><button type="button" class="btn" data-clear>'+esc(T('lg.f.clear'))+'</button></div>':'')+'</div>',meta:meta,pg:''};
    var slice=r.slice((f.pg-1)*PG,f.pg*PG), h='', last='';
    slice.forEach(function(x){
      if(S.tab!=='ref'){var d=day(x.w);if(d!==last){last=d;h+='<div class="lg-day" role="row"><div role="cell" style="display:contents">'+dayLabel(d)+'</div></div>';}}
      h+=S.tab==='task'?rowTask(x):S.tab==='user'?rowUser(x):rowRef(x);
    });
    return {html:h,meta:meta,pg:pager(f.pg,pages,n)};
  }
  function pager(p,pages,n){
    if(pages<=1)return '';
    var a=(p-1)*PG+1, b=Math.min(n,p*PG), btns='';
    for(var i=1;i<=pages;i++)btns+='<button type="button" class="lg-pb" data-pg="'+i+'"'+(i===p?' aria-current="page"':'')+' aria-label="'+esc(T('lg.pg.page',{n:i}))+'">'+i+'</button>';
    return '<nav class="lg-pg" aria-label="'+esc(T('lg.pg.label'))+'"><span>'+App.fill('lg.pg.range',{a:'<span class="mono">'+a+'</span>',b:'<span class="mono">'+b+'</span>',n:'<span class="mono">'+n+'</span>'})+'</span>'+
      '<div class="pgs"><button type="button" class="icon-btn sm" data-pg="'+(p-1)+'"'+(p<=1?' disabled':'')+' aria-label="'+esc(T('lg.pg.prev'))+'">'+ic('chev-l','i-sm')+'</button>'+btns+
      '<button type="button" class="icon-btn sm" data-pg="'+(p+1)+'"'+(p>=pages?' disabled':'')+' aria-label="'+esc(T('lg.pg.next'))+'">'+ic('chev-r','i-sm')+'</button></div></nav>';
  }
  function renderList(){
    if(!$('#rows'))return;
    var b=body();
    $('#meta').innerHTML=b.meta;
    $('#tbl').className='tbl lg-tbl lg-'+S.tab;
    $('#thead').innerHTML=thead();
    $('#rows').innerHTML=b.html;
    $('#rows').setAttribute('aria-busy',S.screen==='loading');
    $('#pg').innerHTML=b.pg;
    var c=$('#fclear'); if(c)c.hidden=!hasF();
  }
  function renderTabs(){
    if(tabsFor().indexOf(S.tab)<0)S.tab='task';
    return tabsFor().map(function(k){
      return '<button type="button" class="tab" role="tab" id="tab-'+k+'" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'" aria-controls="panel" tabindex="'+(S.tab===k?0:-1)+'">'+esc(T('lg.tab.'+k))+'</button>';
    }).join('');
  }
  function render(){
    var m=$('#mount');
    fixNav();
    App.crumbs([{t:'lg.title'},{t:'lg.tab.'+S.tab}]);
    if(!canSee()){
      m.parentElement.classList.add('is-state');
      m.innerHTML='<div class="state page" role="status">'+ic('lock')+'<h1>'+esc(T('lg.na.t'))+'</h1><p>'+esc(T('lg.na.d'))+'</p><div class="acts"><a class="btn btn-p" href="tasks-list.html">'+ic('arrow-l','i-sm')+'<span>'+esc(T('td.backList'))+'</span></a></div></div>';
      document.title=T('app.name')+' · '+T('lg.title');
      return;
    }
    m.parentElement.classList.remove('is-state');
    m.innerHTML='<div class="head"><div><h1>'+esc(T('lg.title'))+'</h1><p>'+esc(T('lg.sub'))+'</p></div>'+
      '<div class="head-act"><button type="button" class="btn pb-zone" data-lgexp title="'+esc(T('lg.pb.export'))+'">'+ic('download','i-sm')+'<span>'+esc(T('lg.export'))+'</span>'+pb(1)+'</button></div></div>'+
      '<div class="lg-ctl"><div class="tabs" role="tablist" id="tabs" aria-label="'+esc(T('lg.tabs'))+'">'+renderTabs()+'</div></div>'+
      '<div id="panel" role="tabpanel" aria-labelledby="tab-'+S.tab+'">'+filters()+
      (S.tab==='ref'?'<p class="lg-hint">'+esc(T('lg.ref.hint'))+'</p>':'')+
      '<div class="lg-meta" id="meta" aria-live="polite"></div>'+
      '<div class="tbl lg-tbl" role="table" id="tbl" aria-label="'+esc(T('lg.tab.'+S.tab))+'"><div class="thead" role="rowgroup"><div role="row" style="display:contents" id="thead"></div></div><div class="tbody" role="rowgroup" id="rows"></div></div>'+
      '<div id="pg"></div></div>';
    renderList();
    document.title=T('app.name')+' · '+T('lg.title');
  }
  function fixNav(){var a=$('#nav a[data-nav="logs"]');if(a)a.removeAttribute('data-soon');}

  /* ---------- Ngăn chi tiết ---------- */
  function drShell(titleKey,b,foot){
    return '<header class="dr-h"><button type="button" class="dr-back" data-lg="close">'+ic('chev-l')+'<span>'+esc(T('td.back'))+'</span></button>'+
      '<h2 class="lg-drt">'+esc(T(titleKey))+'</h2><span class="dr-sep"></span><button type="button" class="icon-btn dr-close" data-lg="close" aria-label="'+esc(T('app.close'))+'">'+ic('x')+'</button></header>'+
      '<div class="dr-b">'+b+'</div>'+(foot?'<footer class="dr-f">'+foot+'</footer>':'');
  }
  function kv(rows){return '<dl class="kv1">'+rows.filter(Boolean).map(function(r){return '<div><dt>'+esc(T(r[0]))+'</dt><dd>'+r[1]+'</dd></div>'}).join('')+'</dl>'}
  function ctable(rows){
    if(!rows.length)return '';
    return '<section class="lg-sec"><h4>'+esc(T('lg.dr.changes'))+'</h4><table class="lg-ct"><thead><tr><th scope="col">'+esc(T('lg.dr.field'))+'</th><th scope="col">'+esc(T('lg.dr.old'))+'</th><th scope="col">'+esc(T('lg.dr.new'))+'</th></tr></thead><tbody>'+
      rows.map(function(c){return '<tr><td>'+esc(T('lg.fld.'+c.f))+'</td><td class="o">'+val(c.o)+'</td><td>'+val(c.n)+'</td></tr>'}).join('')+'</tbody></table></section>';
  }
  function quoteB(k,x,tip){return x?'<section class="lg-sec pb-zone" title="'+esc(T(tip))+'"><h4>'+esc(T(k))+pb(1)+'</h4><blockquote class="lg-quote">'+esc(L(x))+'</blockquote></section>':''}
  function quote(k,x){return x?'<section class="lg-sec"><h4>'+esc(T(k))+'</h4><blockquote class="lg-quote">'+esc(L(x))+'</blockquote></section>':''}
  function evId(id){return '<div class="lg-evid"><span>'+esc(T('lg.dr.evId'))+'</span><span class="mono">'+id+'</span>'+copyBtn(id)+'</div>'}
  function drTask(e){
    var rows=(e.c||[]).slice();
    if(e.os&&e.ns&&e.os!==e.ns)rows.unshift({f:'status',o:{st:e.os},n:{st:e.ns}});
    else if(!e.os&&e.ns)rows.unshift({f:'status',o:null,n:{st:e.ns}});
    var st=e.os&&e.os===e.ns?stat(e.ns)+'<span class="sub">· '+esc(T('lg.dr.same'))+'</span>':null;
    var b='<div class="lg-dh"><span class="stat g-'+e.g+'"><span class="sdot" aria-hidden="true"></span><span>'+esc(T(tLabel(e)))+'</span></span>'+
        '<h3>'+codeLink(e.t)+esc(tTitle(e.t))+'</h3></div>'+
      kv([['lg.dr.when','<span class="mono">'+esc(full(e.w))+'</span>'],
        ['lg.dr.who',av(e.by,'av-sm')+esc(nm(e.by))+'<span class="sub">· '+esc(T(DATA.roleOf?{ADMIN:'role.admin',BOSS:'role.boss'}[DATA.roleOf(e.by)]||'role.emp':(e.by===DATA.BOSS?'role.boss':'role.emp')))+'</span>'],
        st?['lg.dr.status',st]:null])+
      quote('lg.dr.reason',e.r)+quoteB('lg.dr.comment',e.cm,'lg.pb.cm')+ctable(rows)+(e.a==='TRANSFERRED'?quote('lg.dr.note',e.nt):quoteB('lg.dr.note',e.nt,'lg.pb.note'))+
      (e.part&&e.part[0]<e.part[1]?'<section class="lg-sec pb-zone" title="'+esc(T('lg.pb.part'))+'"><h4>'+esc(T('lg.dr.part'))+pb(1)+'</h4><p class="hint" style="margin:0">'+esc(T('lg.chg.verPart',{v:e.v,x:e.part[0],n:e.part[1]}))+'</p></section>':'')+
      (!rows.length&&!e.r&&!e.cm&&!e.nt?'<p class="hint">'+esc(T('lg.chg.none'))+'</p>':'')+evId(e.id);
    var foot='<span class="sp"></span><button type="button" class="btn" data-tasklog="'+e.t+'">'+esc(T('lg.dr.taskLog'))+'</button>'+
      (known(e.t)?'<a class="btn btn-p" href="task.html?id='+e.t+'">'+ic('external','i-sm')+'<span>'+esc(T('lg.dr.openTask'))+'</span></a>':'');
    return drShell('lg.dr.task',b,foot);
  }
  function drUser(e){

      kv([['lg.dr.when','<span class="mono">'+esc(full(e.w))+'</span>'],
        ['lg.dr.who',e.u?av(e.u,'av-sm')+esc(nm(e.u))+'<span class="sub mono">'+esc(UNAME[e.u])+'</span>':'<span class="av unk av-sm" aria-hidden="true">?</span>'+esc(T('lg.unknown'))+'<span class="sub mono">'+esc(T('lg.tried',{u:e.tried}))+'</span>'],
        ['lg.dr.result',esc(uDetail(e))],
        ['lg.dr.ip','<span class="mono">'+esc(e.ip)+'</span>'+ipMark(e)],

  function drRef(r){
    var b='<div class="lg-dh">'+stat(r.s)+'<h3>'+codeLink(r.code)+esc(tTitle(r.code))+'</h3></div>'+
      kv([['lg.col.code','<span class="lg-idrow"><span class="mono">'+r.code+'</span>'+copyBtn(r.code)+'</span>'],

  function drHtml(){

    var list=S.sel.k==='task'?TEV:UEV, e=list.filter(function(x){return x.id===S.sel.id})[0];

  function markSel(){$$('#rows .tr.sel').forEach(function(x){x.classList.remove('sel')});

  function openDr(k,id){
    S.sel={k:k,id:id};

      var r=last&&$('#rows .tr[data-ev="'+last.id+'"],#rows .tr[data-ref="'+last.id+'"]'); if(r)r.focus({preventScroll:false});
    }});
    markSel();
  }

  /* ---------- Chép ---------- */
  function copy(x){
    function ok(){App.toast(T('lg.copied',{x:x}))}
    function fb(){
      var ta=document.createElement('textarea');ta.value=x;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      var done=false;try{done=document.execCommand('copy')}catch(e){} ta.remove();
      if(done)ok();else App.toast(T('lg.copyFail'),'error');
    }
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(ok,fb);else fb();
  }

  /* ---------- Thanh preview ---------- */
  function pv(){
    var cur=S.boot?'normal':S.screen;
    return '<label class="pvl" for="pvScreen">'+esc(T('lg.pv.screen'))+'</label><select id="pvScreen"'+(canSee()?'':' disabled')+'>'+
      [['normal','lg.pv.normal'],['loading','lg.pv.loading'],['nomatch','lg.pv.nomatch'],['error','lg.pv.error']].map(function(x){return opt(x[0],T(x[1]),cur)}).join('')+'</select>';
  }
  var NOMATCH={task:'26-9999',user:'203.0.113.77',ref:'26-9999'};
  function setScreen(v){
    S.boot=false;
    if(v==='nomatch'){S.screen='nomatch';S.f[S.tab].q=NOMATCH[S.tab];S.f[S.tab].pg=1;render();return;}
    if(S.screen==='nomatch'&&S.f[S.tab].q===NOMATCH[S.tab])S.f[S.tab].q='';
    S.screen=v; render();
  }
  function load(ms){
    S.screen='loading'; S.boot=true; if($('#rows'))renderList(); else render();
    setTimeout(function(){S.boot=false;S.screen='normal';renderList();App.refreshPv();},ms);
  }
  /* sau khi người dùng tự lọc, thoát chế độ "Không khớp lọc" của thanh preview */
  function userFiltered(){if(S.screen==='nomatch'){S.screen='normal';App.refreshPv();}}

  App.shell({active:'logs',crumbs:[{t:'lg.title'}],title:'lg.title',pv:pv});

  /* ---------- Sự kiện ---------- */
  var qT;
  document.addEventListener('input',function(e){
    if(e.target.id!=='fq')return;
    var f=S.f[S.tab]; f.q=e.target.value; f.pg=1;
    clearTimeout(qT); qT=setTimeout(function(){userFiltered();renderList();},120);
  });
  document.addEventListener('change',function(e){
    var el=e.target, f=S.f[S.tab];
    if(el.id==='pvScreen'){setScreen(el.value);App.refreshPv();var p=$('#pvScreen');p&&p.focus();return;}
    if(el.matches&&el.matches('[data-f]')){
      if(el.id==='fa'||el.id==='fb'){var na=el.id==='fa'?el.value:f.a,nb=el.id==='fb'?el.value:f.b;if(na&&nb&&na>nb){App.toast(T('lg.f.errRange'),'error');el.value=f[el.id==='fa'?'a':'b'];return;}f[el.id==='fa'?'a':'b']=el.value;}
      else if(el.id==='fwho')f.who=el.value; else if(el.id==='fact')f.act=el.value; else if(el.id==='fip')f.ip=el.value;
      f.pg=1; userFiltered(); renderList();
    }
  });
  function clearF(){var keep=S.tab;S.f[keep]=fresh()[keep];userFiltered();render();var q=$('#fq');q&&q.focus();}
  function goTaskLog(code){App.drawer.close();S.tab='task';S.f.task=fresh().task;S.f.task.q=code;syncUrl();render();var q=$('#fq');q&&q.focus();}
  function syncUrl(){try{history.replaceState(null,'','?tab='+S.tab)}catch(e){}}
  document.addEventListener('click',function(e){
    var el;
    if(e.target.closest('[data-lgexp]')){App.toast(T('lg.pb.export'),'info');return;}
    if((el=e.target.closest('[data-copy]'))){e.stopPropagation();copy(el.dataset.copy);return;}
    if(e.target.closest('[data-stop]'))return;
    if((el=e.target.closest('[data-lg="close"]'))){App.drawer.close();return;}
    if(e.target.closest('#drScrim')){App.drawer.close();return;}
    if((el=e.target.closest('[data-tasklog]'))){goTaskLog(el.dataset.tasklog);return;}
    if((el=e.target.closest('[data-byip]'))){var ip=el.dataset.byip;App.drawer.close();S.f.user=fresh().user;S.f.user.q=ip;render();return;}
    if((el=e.target.closest('#rows .tr[data-ev]'))){openDr(S.tab,el.dataset.ev);return;}
    if((el=e.target.closest('#rows .tr[data-ref]'))){openDr('ref',el.dataset.ref);return;}
    if((el=e.target.closest('#tabs [data-tab]'))){
      if(el.dataset.tab===S.tab)return;
      if(S.screen==='nomatch'){S.f[S.tab].q='';S.screen='normal';App.refreshPv();}
      S.tab=el.dataset.tab; syncUrl(); render(); var t=$('#tab-'+S.tab); t&&t.focus(); return;
    }
    if((el=e.target.closest('[data-pg]'))&&!el.disabled){S.f[S.tab].pg=+el.dataset.pg;renderList();var tb=$('#tbl');if(tb.getBoundingClientRect().top<0)tb.scrollIntoView({block:'start'});var f=$('#pg [aria-current="page"]')||$('#rows .tr[tabindex]');f&&f.focus({preventScroll:true});return;}
    if(e.target.closest('#fclear')||e.target.closest('[data-clear]')){clearF();return;}
    if((el=e.target.closest('#falert'))){var f=S.f.user;f.alert=!f.alert;f.pg=1;el.setAttribute('aria-pressed',f.alert);userFiltered();renderList();return;}
    if(e.target.closest('[data-retry]')){load(900);return;}
  });
  document.addEventListener('keydown',function(e){
    if(App.dialogOpen()||App.drawer.isOpen())return;
    var row=e.target.closest&&e.target.closest('#rows .tr[tabindex]');
    if(row&&(e.key==='Enter'||e.key===' ')&&e.target===row){e.preventDefault();row.click();return;}
    if(row&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault(); var all=$$('#rows .tr[tabindex]'), i=all.indexOf(row)+(e.key==='ArrowDown'?1:-1); if(all[i])all[i].focus(); return;
    }
    var tab=e.target.closest&&e.target.closest('#tabs [data-tab]');
    if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){var m=e.key==='ArrowRight'?tab.nextElementSibling:tab.previousElementSibling;if(m)m.click();}
  });
  function rerenderAll(){render();if(App.drawer.isOpen()){if(!canSee()||(S.sel&&S.sel.k==='ref'&&!priv()))App.drawer.close();else App.drawer.set(drHtml());markSel();}}
  document.addEventListener('langchange',rerenderAll);
  document.addEventListener('rolechange',function(){rerenderAll();App.refreshPv();});
  load(350);
})();
</script>
</body>
</html>
