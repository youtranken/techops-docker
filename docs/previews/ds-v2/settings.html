<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechOps · Cài đặt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- Riêng trang Cài đặt ---------- */
.set{display:grid;grid-template-columns:208px minmax(0,1fr);gap:32px;align-items:start;max-width:1120px}
/* nav con */
.snav{position:sticky;top:76px}
.snav-h{font-size:var(--fs-xs);font-weight:500;color:var(--ink-3);padding:16px 10px 6px}
.snav-h:first-child{padding-top:0}
.snav a{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r-ctl);color:var(--ink-2);text-decoration:none;font-size:var(--fs-md);font-weight:500;position:relative}
.snav a:hover{background:var(--surface-2);color:var(--ink)}
.snav a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.snav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--primary)}
.snav a .ro{margin-left:auto;font-size:var(--fs-xs);font-weight:400;color:var(--ink-3)}
.snav-note{margin:16px 10px 0;font-size:var(--fs-xs);color:var(--ink-3);line-height:1.5}
.snav-m{display:none;margin:0 0 20px}
.snav-m .select{max-width:360px}
/* khung mục */
.sp{min-width:0}
.sp.wide{max-width:none}
.sp-h{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.sp-h>div:first-child{flex:1;min-width:240px}
.sp-h h2{margin:0;font:600 var(--fs-lg)/1.35 var(--f-head);letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp-h h2:focus{outline:none}
.sp-h p{margin:4px 0 0;font-size:var(--fs-sm);color:var(--ink-2);max-width:620px}
.sp-act{display:flex;align-items:center;gap:8px;flex:none;padding-top:2px}
.tagx{display:inline-flex;align-items:center;gap:5px;font:400 var(--fs-xs)/1 var(--f-body);color:var(--ink-3);letter-spacing:0}
.tagx .i{width:13px;height:13px}
.tag-wait{--k:var(--amber)}
.sp-h h2 .stat,.sp-h h2 .tagx{font:400 var(--fs-sm)/1.4 var(--f-body);letter-spacing:0}
/* khối form */
/* .blk/.blk-h/.blk-b dùng chung từ app.css; trang chỉ thêm khoảng cách + dòng mô tả dưới tiêu đề */
.sp .blk{margin:0 0 16px}
.sp .blk-h{flex-wrap:wrap;column-gap:12px;row-gap:2px;padding:12px 20px}
.sp .blk-h p{flex-basis:100%;margin:0;font-size:var(--fs-xs);color:var(--ink-3)}
.sp .blk-b{padding:16px 20px 18px}
.blk-b>.field:last-child,.blk-b>.fg:last-child{margin-bottom:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;margin:0 0 16px}
.fg .field{margin:0}
.fg .span2{grid-column:1/-1}
.fg.c3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
fieldset.fs{border:0;margin:0;padding:0;min-width:0}
fieldset.fs:disabled .blk,fieldset.fs:disabled .srow-top{opacity:.55}
/* hàng bật/tắt: chữ trái, công tắc phải */
.srow{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0;padding-top:0}
.srow:last-child{padding-bottom:0}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-weight:500;font-size:var(--fs-md);color:var(--ink)}
.srow .tx>span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px}
.srow-top{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:16px 20px;margin:0 0 16px}
/* công tắc chuẩn duy nhất của V2 */
.sw{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:36px;height:20px;margin:1px 0 0;border-radius:var(--r-pill);background:var(--line-2);cursor:pointer;transition:background .15s}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,41,.25);transition:transform .15s}
.sw:checked{background:var(--primary)}
.sw:checked::before{transform:translateX(16px)}
html[data-theme="dark"] .sw::before{background:#DDE1E8;box-shadow:none}
html[data-theme="dark"] .c-dot{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw:disabled{opacity:.5;cursor:default}
.sw:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-pill)}
/* danh sách ô chọn có mô tả */
.clist{border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden}
.clist-h{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:var(--fs-sm)}
.clist-h .check{font-weight:500;min-height:28px}
.clist-h .n{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.citem{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.clist-h+.citem,.citem:first-child{border-top:0}
.citem:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.citem input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--primary);flex:none}
.citem .tx{flex:1;min-width:0}
.citem .tx b{display:flex;align-items:center;gap:8px;font-weight:500;font-size:var(--fs-md)}
.citem .tx>span{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:1px}
.citem .who{flex:none;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;padding-top:2px}
.citem.dis{cursor:default}
.citem.dis:hover{background:transparent}
.citem.dim .tx{opacity:.6}
.c2{display:grid;grid-template-columns:1fr 1fr}
.c2 .citem:nth-child(2){border-top:0;border-left:1px solid var(--line)}
/* chọn thứ + giờ */
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{position:relative}
.day input{position:absolute;opacity:0;width:1px;height:1px}
.day span{display:grid;place-items:center;min-width:44px;height:34px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r-ctl);font-size:var(--fs-sm);font-weight:500;color:var(--ink-2);background:var(--surface);cursor:pointer}
.day span:hover{border-color:var(--ink-3);color:var(--ink)}
.day input:checked+span{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.day input:focus-visible+span{outline:2px solid var(--primary);outline-offset:2px}
.day input:disabled+span{opacity:.55;cursor:default}
.lblrow{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}
.lblrow .lbl{margin:0}
.lblrow .btn-link{margin-left:auto;padding:2px 6px}
.time{display:flex;align-items:center;gap:8px}
.time .select{width:84px;font-family:var(--f-mono)}
.time .faint{font-size:var(--fs-xs)}
.sum{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.sum .i{color:var(--ink-3);margin-top:2px}
.sum b{font-weight:500;color:var(--ink)}
/* người nhận */
.rcp{border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden}
.rcp-t{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rcp-t .search{flex:1}
.rcp-l{max-height:264px;overflow-y:auto;overscroll-behavior:contain}
.rcp-l .citem{align-items:center}
.rcp-l .citem .tx b{font-size:var(--fs-sm)}
.rcp-l .citem .tx b .av{flex:none}
/* ô có đơn vị */
.unit{display:flex;align-items:center;gap:8px}
.unit .input{max-width:132px;font-family:var(--f-mono);text-align:right}
.unit span{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap}
.pw{position:relative}
.pw .input{padding-right:42px}
.pw .icon-btn{position:absolute;right:2px;top:1px;width:34px;height:36px}
/* bảng các mục */
.c-dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(15,23,41,.12)}
.nm{display:flex;align-items:center;gap:10px;min-width:0}
.nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nm .tico{width:30px;height:30px;border-radius:var(--r-ctl);display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.td .faint,.td .muted{font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .mono{font-size:var(--fs-sm)}
.c-sub{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rowact{justify-content:flex-end;gap:2px}
.mlab{display:none}
.t-pri{--cols:minmax(0,1fr) 64px 108px 96px 76px}
.t-typ{--cols:minmax(0,1fr) minmax(0,1.5fr) 96px 76px}
.t-tpl{--cols:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.9fr) 104px 76px}
.t-eml{--cols:minmax(0,1fr) minmax(0,1.6fr) 96px 20px}
.tbl-note{margin:12px 2px 0;font-size:var(--fs-xs);color:var(--ink-3)}
/* chọn biểu tượng */
.icgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.icopt{position:relative;display:grid;place-items:center;height:38px;border:1px solid var(--line);border-radius:var(--r-ctl);color:var(--ink-2);cursor:pointer;background:var(--surface)}
.icopt input{position:absolute;opacity:0;width:1px;height:1px}
.icopt:hover{border-color:var(--line-2);color:var(--ink);background:var(--surface-2)}
.icopt:has(input:checked){border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.icopt:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.color{display:flex;gap:8px}
.color input[type=color]{width:42px;height:38px;padding:3px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--surface);cursor:pointer;flex:none}
.color .input{font-family:var(--f-mono)}
.cnt-r{display:flex;justify-content:space-between;gap:12px}
.cnt-r .hint:last-child{font-family:var(--f-mono);white-space:nowrap}
/* soạn mẫu email */
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.vars .chip{height:22px;font-size:11px}
.ta.code{font-family:var(--f-mono);font-size:var(--fs-sm);min-height:220px;line-height:1.55}
.prev{width:100%;height:260px;border:1px solid var(--line);border-radius:var(--r-ctl);background:#fff}
/* xem trước email giữ nền trắng như hộp thư thật; ở dark viền rõ hơn và có khoảng đệm để không thành mảng chói sát mép */
html[data-theme="dark"] .prev{border-color:var(--line-2);background:#F3F5F9;opacity:.94}
.ed-top{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.ed-top .lbl{margin:0}
.ed-top .seg{margin-left:auto}
/* kết quả kiểm tra */
.res{display:flex;align-items:flex-start;gap:8px;margin:12px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.res .sdot{margin-top:6px}
.res b{color:var(--ink);font-weight:500}
.res.ok{--k:var(--c-done)} .res.bad{--k:var(--danger)}
.res.bad b{color:var(--danger)}
.test{display:flex;align-items:flex-end;gap:10px}
.test .field{flex:1;margin:0;min-width:0}
/* thanh lưu: chỉ hiện khi có thay đổi chưa lưu */
.savebar{position:sticky;bottom:16px;z-index:25;display:flex;align-items:center;gap:10px;margin:20px 0 0;padding:10px 12px 10px 16px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);box-shadow:var(--shadow-pop)}
.savebar .msg{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:500;color:var(--ink)}
.savebar .pd{width:8px;height:8px;border-radius:50%;background:var(--c-review);flex:none}
body:has(.savebar:not([hidden])) .pv{bottom:86px}
body:has(.savebar:not([hidden])) .toasts{bottom:140px}
/* skeleton */
.sk-blk{padding:18px 20px}
.sk-blk .sk+.sk{margin-top:12px}
.sk-in{height:38px;border-radius:var(--r-ctl)}
.sk-tr{display:flex;align-items:center;gap:16px;height:52px;padding:0 20px;border-top:1px solid var(--line)}
.sk-tr:first-child{border-top:0;height:40px}
.err-top{margin:0 0 16px}
.srow .tx b .phase-b{margin-left:8px}
/* Tạm thời: agent lõi sẽ đưa .phase-b vào app.css; rule dưới chỉ là dự phòng */
.phase-b{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px dashed var(--amber);border-radius:var(--r-pill);font:500 11px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;vertical-align:middle;letter-spacing:0}
.err-top .acts{margin-left:auto;flex:none}
.note .grow{flex:1;min-width:0}

@media (max-width:1199px){
  .set{grid-template-columns:184px minmax(0,1fr);gap:28px}
}
@media (max-width:1023px){
  .set{display:block}
  .snav{display:none}
  .snav-m{display:block}
}
@media (max-width:680px){
  .sp-h{margin-bottom:16px}
  .sp-act{width:100%}
  .sp-act .btn{flex:1}
  .sp .blk-h{padding:12px 16px}
  .sp .blk-b{padding:14px 16px 16px}
  .srow-top{padding:14px 16px}
  .fg,.fg.c3{grid-template-columns:minmax(0,1fr);gap:14px}
  .c2{grid-template-columns:1fr}
  .c2 .citem:nth-child(2){border-left:0;border-top:1px solid var(--line)}
  .citem .who{display:none}
  .days{gap:5px}
  .day{flex:1 1 0}
  .day span{min-width:0;padding:0 2px}
  .icgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .mlab{display:inline}
  .tr .dash{display:none}
  .tr .td{font-size:var(--fs-sm)}
  .tr .c-desc{flex:1 1 100%;order:2}
  .tr .c-desc:empty{display:none}
  .test{flex-direction:column;align-items:stretch}
  .test .btn{width:100%}
  .err-top{flex-wrap:wrap}
  .err-top .acts{margin-left:26px}
  /* thanh lưu dính đáy toàn chiều ngang */
  .savebar{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border-width:1px 0 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(15,23,41,.10)}
  .savebar .msg{display:none}
  .savebar .btn{flex:1;height:42px}
  body:has(.savebar:not([hidden])) .pv{bottom:76px}
  body:has(.savebar:not([hidden])) .toasts{bottom:132px}
}
</style>
</head>

<script>
(function(){
  /* ============ Cài đặt — nguồn: src/app/(dashboard)/settings/** + src/modules/settings/** (V1) ============ */
  var T=I18N.t, esc=App.esc, $=App.$, $$=App.$$, L=I18N.L, av=App.av, nm=App.nm;
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
  function pad(n){return String(n).padStart(2,'0')}
  function opt(v,label,cur,dis){return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+(dis?' disabled':'')+'>'+esc(label)+'</option>'}

  /* ---------- Danh mục mục (nhóm theo nav con) ----------
     perm: khoá featurePermissions['settings'] (settings-guard) · boss: chỉ ADMIN/BOSS · admin: chỉ ADMIN · form: có thanh lưu */
  var SECS=[
    {k:'priorities',g:'work',perm:'priorities'},
    {k:'types',g:'work',perm:'task_types'},
    {k:'templates',g:'work',perm:'completion_templates'},
    {k:'notifications',g:'notif',perm:'notifications',form:1},
    {k:'digest',g:'notif',boss:1,form:1},
    {k:'overdue',g:'notif',boss:1,form:1},
    {k:'smtp',g:'sys',admin:1,form:1},
    {k:'emails',g:'sys',admin:1},
    {k:'security',g:'sys',admin:1,form:1},
    {k:'general',g:'sys',admin:1,form:1,pending:1}
  ];
  /* Vai trò V1 (PPDATA.myRole): ADMIN = mọi mục · BOSS = trừ mục admin (SettingsMenu.tsx:129-145, requireRole ADMIN cho smtp/security/general)
     · EMPLOYEE = chỉ các mục được cấp trong featurePermissions['settings'] của chính người đó (settings-guard.ts:13-43), lấy từ pp-data
     (Lê Minh: completion_templates + profile + notifications). Thông báo với nhân viên luôn chỉ xem (notification-prefs PATCH 403). */
  function role(){return PPDATA.myRole()}
  function priv(){return role()!=='EMPLOYEE'}
  function empGrants(){var m=PPDATA.myMenu();return m&&m.menus.indexOf('settings')>-1?(m.feat.settings||[]):[]}
  function sec(k){return SECS.filter(function(s){return s.k===k})[0]}
  function allowed(s){if(!s)return false;if(role()==='ADMIN')return true;if(s.admin)return false;if(role()==='BOSS')return true;if(s.boss)return false;return empGrants().indexOf(s.perm)>-1}
  function firstAllowed(){return (SECS.filter(allowed)[0]||SECS[0]).k}
  function isRO(k){return !priv()&&k==='notifications'}

  /* ---------- Dữ liệu mẫu (dựa theo types.ts / service V1) ---------- */
  /* Người nhận digest / gửi thử SMTP: mọi người dùng đang hoạt động (DigestRecipientsFields.tsx:44 → /api/hr/users?isActive=true) */
  var USERS=PPDATA.users().filter(function(u){return u.st!=='locked'}).map(function(u){return {c:u.id,n:u.n,e:u.e,r:u.r,o:u}});
  var ICONS=['Monitor','Cpu','Wifi','Server','HardDrive','Wrench','Code','Globe','Database','Shield','Printer','Phone','Mail','Lock','Settings','Zap','Bug','FileText','Users','Package','Cloud','Terminal','Network','LayoutGrid'];
  /* NOTIFICATION_TYPES: [key, roles] */
  var NT=[['TASK_ASSIGNED',['EMP']],['TASK_APPROVED',['EMP']],['TASK_REJECTED',['EMP']],['TRANSFER_RECEIVED',['EMP']],['EXTENSION_REQUESTED',['BOSS']],
    ['EXTENSION_APPROVED',['EMP']],['EXTENSION_REJECTED',['EMP']],['REVIEW_REQUIRED',['BOSS']],['REVISION_REQUIRED',['EMP']],['TASK_COMPLETED',['EMP','BOSS']],
    ['COMMENT_ADDED',['EMP','BOSS']],['DEADLINE_REMINDER',['EMP','BOSS']],['ALL_FAILED',['BOSS']],['PLAN_APPROVAL_REQUESTED',['BOSS']]];
  var ETPL=['TASK_ASSIGNED','TASK_APPROVED','TASK_REJECTED','TASK_COMPLETED','PLAN_APPROVAL_REQUESTED','REVIEW_REQUIRED','REVISION_REQUIRED','TRANSFER_RECEIVED','EXTENSION_REQUESTED','EXTENSION_APPROVED','EXTENSION_REJECTED','DEADLINE_REMINDER','COMMENT_ADDED','ALL_FAILED'];
  var DIGEST_C=['DEADLINE_SOON','IN_PROGRESS','OVERDUE','PENDING_APPROVAL','SUMMARY_BY_EMPLOYEE'];
  var OVD_CAT=['PENDING_APPROVAL','PENDING_REVIEW','IN_PROGRESS','WAITING_ACKNOWLEDGE'];
  var OVD_IND=['OVERDUE','PENDING_ACK','UPCOMING'];
  var DAYS=[1,2,3,4,5,6,0], WEEKDAYS=[1,2,3,4,5], MINUTES=[0,15,30,45];
  var TZ=[['Asia/Bangkok','+7'],['Asia/Ho_Chi_Minh','+7'],['Asia/Jakarta','+7'],['Asia/Singapore','+8'],['Asia/Kuala_Lumpur','+8'],['Asia/Manila','+8'],['Asia/Shanghai','+8'],
    ['Asia/Tokyo','+9'],['Asia/Seoul','+9'],['Asia/Kolkata','+5:30'],['Asia/Dubai','+4'],['Europe/London','+0/+1'],['Europe/Paris','+1/+2'],['UTC','+0'],['America/New_York','−5/−4'],['America/Los_Angeles','−8/−7']];
  var SEC_DEFAULT={rateLimit:{enabled:true,maxRequests:100,windowSeconds:60,loginMaxAttempts:5,lockoutMinutes:15},
    passwordPolicy:{minLength:8,requireUppercase:true,requireLowercase:true,requireNumber:true,requireSpecialChar:false,expiryDays:0,historyCount:0},
    session:{idleTimeoutMinutes:30,maxSessionHours:24,allowMultipleSessions:true}};
  /* giới hạn số theo SecurityRateLimitCard / PasswordCard / SessionCard */
  var LIM={'rateLimit.loginMaxAttempts':[3,20],'rateLimit.lockoutMinutes':[5,60],'rateLimit.maxRequests':[10,1000],'passwordPolicy.minLength':[6,32],
    'passwordPolicy.expiryDays':[0,365],'session.idleTimeoutMinutes':[5,1440],'session.maxSessionHours':[1,168],'port':[1,65535]};

  function bi(vi,en){return {vi:vi,en:en}}
  function build(){
    var lg=I18N.lang;
    function body(k){return '<p>'+T('set.em.hi',{u:'{{userName}}'})+'</p>\n<p>'+T('set.em.l.'+k)+'</p>\n<p><b>{{taskTitle}}</b> · '+T('set.em.due')+' {{deadline}}</p>\n<p><a href="{{taskUrl}}">'+T('set.em.cta')+'</a></p>'}
    return {
      priorities:[
        {id:'p1',n:bi('Khẩn cấp','Urgent'),c:'#D0443A',lv:4,def:false,u:12},
        {id:'p2',n:bi('Cao','High'),c:'#C2780A',lv:3,def:false,u:34},
        {id:'p3',n:bi('Thường','Normal'),c:'#1D4ED8',lv:2,def:true,u:187},
        {id:'p4',n:bi('Thấp','Low'),c:'#8892A6',lv:1,def:false,u:21}],
      types:[
        {id:'t1',n:bi('Bảo mật','Security'),ic:'Shield',d:bi('Firewall, VPN, phân quyền','Firewall, VPN, access control'),u:18},
        {id:'t2',n:bi('Hỗ trợ','Support'),ic:'Wrench',d:bi('Xử lý yêu cầu từ Helpdesk','Requests coming from Helpdesk'),u:96},
        {id:'t3',n:bi('Khác','Other'),ic:'LayoutGrid',d:null,u:7},
        {id:'t4',n:bi('Mạng','Network'),ic:'Network',d:bi('Switch, router, Wi-Fi','Switches, routers, Wi-Fi'),u:41},
        {id:'t5',n:bi('Máy in','Printers'),ic:'Printer',d:null,u:0},
        {id:'t6',n:bi('Phần cứng','Hardware'),ic:'HardDrive',d:bi('Máy trạm, NAS, linh kiện','Workstations, NAS, parts'),u:52},
        {id:'t7',n:bi('Phần mềm','Software'),ic:'Code',d:bi('Cài đặt, cập nhật, bản quyền','Installs, updates, licenses'),u:63},
        {id:'t8',n:bi('Tài khoản','Accounts'),ic:'Users',d:bi('Email, AD, tài khoản ứng dụng','Email, AD, app accounts'),u:29}],
      templates:[
        {id:'r1',ti:bi('Báo cáo cài đặt phần mềm','Software install report'),cat:bi('Phần mềm','Software'),ty:'t7',active:true,
          tx:bi('Máy đã cài:\nPhiên bản:\nĐã kích hoạt bản quyền: Có / Không\nGhi chú:','Machines installed:\nVersion:\nLicense activated: Yes / No\nNotes:')},
        {id:'r2',ti:bi('Biên bản thay thế thiết bị','Hardware replacement record'),cat:bi('Phần cứng','Hardware'),ty:'t6',active:true,
          tx:bi('Thiết bị cũ (serial):\nThiết bị mới (serial):\nĐã kiểm tra hoạt động: Có / Không','Old device (serial):\nNew device (serial):\nTested working: Yes / No')},
        {id:'r3',ti:bi('Kết quả xử lý sự cố mạng','Network incident result'),cat:bi('Kỹ thuật','Technical'),ty:'t4',active:true,
          tx:bi('Nguyên nhân:\nCách xử lý:\nThời gian gián đoạn:','Root cause:\nFix:\nDowntime:')},
        {id:'r4',ti:bi('Mẫu chung (cũ)','General template (old)'),cat:null,ty:null,active:false,tx:bi('Đã làm:\nKết quả:','Done:\nResult:')}],
      notifications:{emailEnabled:true,types:['TASK_ASSIGNED','TASK_APPROVED','TASK_REJECTED','TRANSFER_RECEIVED','EXTENSION_REQUESTED','EXTENSION_APPROVED','EXTENSION_REJECTED','REVIEW_REQUIRED','REVISION_REQUIRED','TASK_COMPLETED','DEADLINE_REMINDER','ALL_FAILED','PLAN_APPROVAL_REQUESTED']},
      digest:{enabled:true,sendWeekly:true,sendMonthly:false,sendDays:[],sendHour:8,sendMinute:0,recipientIds:[],contentTypes:DIGEST_C.slice(),
        emailSubject:T('set.dg.subjDef'),emailGreeting:T('set.dg.greetDef')},
      overdue:{enabled:true,sendDays:[1,2,3,4,5],sendHour:9,sendMinute:0,digestCategories:OVD_CAT.slice(),individualEmailTypes:OVD_IND.slice()},
      smtp:{host:'smtp.office365.com',port:587,secure:false,user:'techops@pmh.com.vn',password:'',fromName:'TechOps',fromEmail:'techops@pmh.com.vn',isActive:true},
      smtpConfigured:true,
      emails:ETPL.map(function(k){return {key:k,sub:T('set.em.s.'+k),body:body(k),custom:k==='TASK_ASSIGNED'||k==='DEADLINE_REMINDER'}}),
      security:clone(SEC_DEFAULT),
      general:{timezone:'Asia/Bangkok'},
      lang:lg
    };
  }
  var DB=build();
  /* trạng thái: sec, screen normal|loading|error, draft/err của mục form, bộ lọc xem */
  var S={sec:null,screen:'loading',touched:false,draft:{},errs:{},tried:false,saving:false,nf:'all',rq:'',testTo:'',smtpTo:'LM',smtpRes:null,smtpTesting:false,pvSmtp:'ok',showPw:false,dgTesting:false};
  S.draft=freshDrafts();
  function freshDrafts(){var d={};SECS.forEach(function(s){if(s.form)d[s.k]=clone(DB[s.k])});return d}
  function dirty(k){k=k||S.sec;var s=sec(k);return !!(s&&s.form&&!isRO(k)&&!same(S.draft[k],DB[k]))}
  function getP(o,p){return p.split('.').reduce(function(a,x){return a==null?a:a[x]},o)}
  function setP(o,p,v){var a=p.split('.'),l=a.pop();a.reduce(function(x,y){return x[y]},o)[l]=v}

  /* ---------- Khung chung ---------- */
  function navHtml(){
    var h='',g=null;
    SECS.filter(allowed).forEach(function(s){
      if(s.g!==g){g=s.g;h+='<div class="snav-h">'+esc(T('set.g.'+g))+'</div>';}
      h+='<a href="#'+s.k+'" data-sec="'+s.k+'"'+(S.sec===s.k?' aria-current="page"':'')+'><span>'+esc(T('set.s.'+s.k))+'</span>'+
        (isRO(s.k)?'<span class="ro">'+esc(T('set.ro.short'))+'</span>':s.pending?'<span class="ro">'+esc(T('set.pending.short'))+'</span>':'')+'</a>';
    });
    if(!priv())h+='<p class="snav-note">'+esc(T('set.nav.empNote'))+'</p>';
    return h;
  }
  function selHtml(){
    var h='',g=null;
    SECS.filter(allowed).forEach(function(s){
      if(s.g!==g){if(g)h+='</optgroup>';g=s.g;h+='<optgroup label="'+esc(T('set.g.'+g))+'">';}
      h+=opt(s.k,T('set.s.'+s.k)+(isRO(s.k)?' · '+T('set.ro.short'):''),S.sec);
    });
    return h+'</optgroup>';
  }
  function head(k,act,tags){
    var s=sec(k);
    var t=(s.admin?'<span class="tagx">'+ic('lock')+esc(T('set.adminOnly'))+'</span>':'')+
      (s.pending?'<span class="stat tag-wait"><span class="sdot" aria-hidden="true"></span><span>'+esc(T('set.pending'))+'</span></span>':'')+(tags||'');
    return '<div class="sp-h"><div><h2 id="spTitle" tabindex="-1">'+esc(T('set.s.'+k))+t+'</h2><p>'+esc(T('set.d.'+k))+'</p></div>'+(act?'<div class="sp-act">'+act+'</div>':'')+'</div>';
  }
  function errNote(form){
    return '<div class="note bad err-top" role="alert">'+ic('alert','i-sm')+'<span class="grow"><b>'+esc(T(form?'set.err.formT':'set.err.listT'))+'</b><br>'+esc(T(form?'set.err.formD':'set.err.listD'))+'</span>'+
      '<span class="acts"><button type="button" class="btn btn-sm" data-retry>'+ic('refresh','i-xs')+'<span>'+esc(T('app.retry'))+'</span></button></span></div>';
  }
  function skel(k){
    var s=sec(k),w=[38,62,48,70,54];
    if(!s.form){
      return '<div class="tbl" aria-hidden="true">'+[0,1,2,3,4].map(function(i){return '<div class="sk-tr">'+(i?'<span class="sk circle" style="width:12px;height:12px"></span>':'')+'<span class="sk line" style="width:'+w[i]+'%"></span><span class="sk line" style="width:56px;margin-left:auto"></span></div>'}).join('')+'</div>';
    }
    return [0,1].map(function(b){return '<div class="blk sk-blk" aria-hidden="true"><span class="sk line" style="width:'+(b?30:22)+'%;height:14px"></span><span class="sk line" style="width:55%"></span>'+
      '<div class="fg" style="margin:18px 0 0"><div><span class="sk line" style="width:40%;margin-bottom:8px"></span><span class="sk sk-in"></span></div><div><span class="sk line" style="width:30%;margin-bottom:8px"></span><span class="sk sk-in"></span></div></div></div>'}).join('');
  }
  function noAccess(){
    var s=sec(S.sec), any=SECS.some(allowed);
    return '<div class="state page" role="status">'+ic('lock')+'<h1>'+esc(T('set.na.t'))+'</h1><p>'+esc(T(s&&s.admin?'set.na.dAdmin':'set.na.d'))+'</p>'+(any?'<div class="acts"><a class="btn btn-p" href="#'+firstAllowed()+'" data-sec="'+firstAllowed()+'">'+esc(T('set.na.go',{s:T('set.s.'+firstAllowed())}))+'</a></div>':'')+'</div>';
  }

  /* ---------- Thành phần form ---------- */
  function sw(f,on,dis,lab){return '<input type="checkbox" role="switch" class="sw" data-f="'+f+'"'+(on?' checked':'')+(dis?' disabled':'')+' aria-label="'+esc(lab)+'">'}
  function srow(f,on,title,hint,dis){return '<div class="srow"><div class="tx"><b id="lb-'+f.replace(/\./g,'-')+'">'+esc(title)+'</b>'+(hint?'<span>'+esc(hint)+'</span>':'')+'</div>'+sw(f,on,dis,title)+'</div>'}
  function errP(f){var e=S.errs[S.sec]&&S.errs[S.sec][f];return '<p class="err" id="e-'+f.replace(/\./g,'-')+'"'+(e?'':' hidden')+'>'+(e?ic('alert','i-xs')+'<span>'+esc(e)+'</span>':'')+'</p>'}
  function inv(f){return S.errs[S.sec]&&S.errs[S.sec][f]?' aria-invalid="true" aria-describedby="e-'+f.replace(/\./g,'-')+'"':''}
  function field(f,label,val,o){
    o=o||{};var id='f-'+f.replace(/\./g,'-');
    var inp=o.ta?'<textarea class="ta" id="'+id+'" data-f="'+f+'" rows="'+(o.rows||3)+'"'+inv(f)+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(val)+'</textarea>'

  function pDigest(lock){

    if(D.enabled&&!D.contentTypes.length)h+='<div class="note warn" style="margin:0 0 16px" role="status">'+ic('alert','i-sm')+'<span>'+esc(T('set.dg.warnContent'))+'</span></div>';
    /* lịch gửi */
    var parts=[];
    if(D.sendWeekly)parts.push(T('set.dg.sumW'));
    if(D.sendMonthly)parts.push(T('set.dg.sumM'));
    if(D.sendDays.length)parts.push(dayList(D.sendDays));
    h+='<div class="blk"><div class="blk-h"><h3>'+esc(T('set.dg.sched'))+'</h3></div><div class="blk-b">'+
      '<div class="field"><span class="lbl">'+esc(T('set.dg.period'))+'</span><div class="clist c2">'+
        citem('data-f="sendWeekly"',D.sendWeekly,T('set.dg.weekly'),T('set.dg.weeklyH'))+citem('data-f="sendMonthly"',D.sendMonthly,T('set.dg.monthly'),T('set.dg.monthlyH'))+'</div></div>'+
      dayPicker('sendDays',D.sendDays,T('set.dg.days'))+timePicker(D)+
      '<p class="sum">'+ic('calendar','i-sm')+'<span>'+(parts.length?App.fill('set.sumAt',{d:'<b>'+esc(parts.join(' · '))+'</b>',t:'<b class="mono">'+pad(D.sendHour)+':'+pad(D.sendMinute)+'</b>'}):esc(T('set.dg.sumNone')))+'</span></p>'+
      '</div></div>';
    /* người nhận */
    var q=S.rq.trim().toLowerCase(), us=USERS.filter(function(u){return !q||(u.n+' '+(u.e||'')).toLowerCase().indexOf(q)>-1});
    var withMail=us.filter(function(u){return u.e}), allSel=withMail.length&&withMail.every(function(u){return D.recipientIds.indexOf(u.c)>-1});
    h+='<div class="blk"><div class="blk-h"><h3>'+esc(T('set.dg.rcp'))+'</h3><span class="aux">'+esc(D.recipientIds.length?T('set.dg.rcpN',{n:D.recipientIds.length}):T('set.dg.rcpAll'))+'</span><p>'+esc(T('set.dg.rcpH'))+'</p></div><div class="blk-b">'+
      '<div class="rcp"><div class="rcp-t"><label class="search">'+ic('search','i-sm')+'<span class="sr">'+esc(T('set.dg.rcpQ'))+'</span><input type="search" id="rcpQ" value="'+esc(S.rq)+'" placeholder="'+esc(T('set.dg.rcpQ'))+'"></label>'+
        (withMail.length?'<button type="button" class="btn-link" data-rcpall>'+esc(T(allSel?'set.clearAll':'set.selAll'))+'</button>':'')+'</div><div class="rcp-l">'+
        (us.length?us.map(function(u){var ok=!!u.e;return citem('data-arr="recipientIds" value="'+u.c+'"',D.recipientIds.indexOf(u.c)>-1,u.n,(u.e||T('set.dg.noMail'))+' · '+T('pp.role.'+u.r),{pre:PPDATA.av(u.o,'av-sm'),dis:!ok,dim:!ok,title:ok?'':T('set.dg.noMailH')})}).join('')
          :'<div class="state" style="padding:24px"><span>'+esc(T('set.dg.rcpNone'))+'</span></div>')+'</div></div></div></div>';
    /* nội dung */
    var allC=DIGEST_C.every(function(k){return D.contentTypes.indexOf(k)>-1});
    h+='<div class="blk"><div class="blk-h"><h3>'+esc(T('set.dg.content'))+'</h3><p>'+esc(T('set.dg.contentH'))+'</p></div><div class="blk-b"><div class="clist">'+
      '<div class="clist-h"><label class="check"><input type="checkbox" data-allarr="contentTypes"'+(allC?' checked':'')+'><span>'+esc(T('set.selAll'))+'</span></label><span class="n">'+esc(T('set.nSel',{a:D.contentTypes.length,b:DIGEST_C.length}))+'</span></div>'+

    /* mẫu email + gửi thử */
    var dt=dirty('digest');
    h+='<div class="blk"><div class="blk-h"><h3>'+esc(T('set.dg.tpl'))+'</h3></div><div class="blk-b">'+
      field('emailSubject',T('set.dg.subj'),D.emailSubject,{req:1,hint:App.fill('set.dg.subjH',{v:'<code class="mono">{date}</code>'})})+
      field('emailGreeting',T('set.dg.greet'),D.emailGreeting,{ta:1,rows:3})+
      '<div class="test"><div class="field"><label class="lbl" for="dgTo">'+esc(T('set.dg.testTo'))+'</label><input class="input" type="email" id="dgTo" value="'+esc(S.testTo)+'" placeholder="ten@pmh.com.vn" autocomplete="email"'+(dt?' disabled':'')+'><p class="err" id="dgToE" hidden></p></div>'+
      '<button type="button" class="btn" id="dgTest"'+(dt||S.dgTesting?' disabled':'')+'>'+ic('send','i-sm')+'<span>'+esc(T(S.dgTesting?'set.sending':'set.dg.test'))+'</span></button></div>'+
      '<p class="hint" id="dgHint">'+esc(T(dt?'set.testDirty':'set.dg.testH'))+'</p></div></div></fieldset>';

    else sp.innerHTML=PANEL[k](S.screen==='error');

    $$('[data-ntall]',sp).forEach(function(c){var D=S.draft.notifications;var n=$$('[data-arr="types"]:checked',sp).length,all=$$('[data-arr="types"]',sp).length;c.indeterminate=n>0&&n<all});
    $$('[data-allarr]',sp).forEach(function(c){var n=$$('[data-arr="'+c.dataset.allarr+'"]:checked',sp).length,all=$$('[data-arr="'+c.dataset.allarr+'"]',sp).length;c.indeterminate=n>0&&n<all});

  function bar(){

  function soft(){

  function focusKey(el){
    if(!el||!el.closest||!el.closest('#sp'))return null;
    if(el.id)return '#'+el.id;
    if(el.dataset.arr)return '[data-arr="'+el.dataset.arr+'"][value="'+el.value+'"]';
    if(el.dataset.f)return '[data-f="'+el.dataset.f+'"]';
    if(el.dataset.nf)return '[data-nf="'+el.dataset.nf+'"]';
    if(el.dataset.wk)return '[data-wk="'+el.dataset.wk+'"]';

    if(el.hasAttribute('data-pw'))return '[data-pw]';

  function load(ms){
    S.screen='loading';render();App.refreshPv();

  function discard(k){S.draft[k]=clone(DB[k]);S.errs[k]={};S.tried=false;S.showPw=false;}
  function show(k,push){
    if(!sec(k))k=firstAllowed();

    if(push!==false&&location.hash!=='#'+k)history.pushState(null,'','#'+k);

    load(260);
    $('#spTitle')&&$('#spTitle').focus({preventScroll:true});
    window.scrollTo({top:0});

  function go(k,onCancel){

        onOk:function(){discard(S.sec);show(k);},onClose:onCancel});
      return;
    }

  /* ---------- Lưu / Hoàn tác ---------- */
  function validate(k){
    var D=S.draft[k], e={};
    function num(p){var l=LIM[p],v=getP(D,p);if(v===''||v==null||isNaN(v)||Math.floor(v)!==Number(v))e[p]=T('set.v.int');else if(v<l[0]||v>l[1])e[p]=T('set.v.range',{a:l[0],b:l[1]});}
    var mail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(k==='smtp'){
      if(!String(D.host).trim())e.host=T('set.v.req');
      num('port');
      if(!String(D.fromEmail).trim())e.fromEmail=T('set.v.req');else if(!mail.test(D.fromEmail))e.fromEmail=T('set.v.mail');
      if(D.user&&!mail.test(D.user))e.user=T('set.v.mail');
      if(!DB.smtpConfigured&&!D.password)e.password=T('set.v.req');
    }
    if(k==='security')Object.keys(LIM).forEach(function(p){if(p!=='port')num(p)});
    if(k==='digest'&&!String(D.emailSubject).trim())e.emailSubject=T('set.v.req');
    S.errs[k]=e;
    return Object.keys(e);
  }
  function save(){
    var k=S.sec, bad=validate(k);
    if(bad.length){render('[data-f="'+bad[0]+'"]');App.toast(T('set.v.fix',{n:bad.length}),'error');return;}
    S.saving=true;bar();
    setTimeout(function(){
      S.saving=false;S.touched=true;
      var d=clone(S.draft[k]);
      if(k==='smtp'){if(d.password)DB.smtpConfigured=true;d.password='';S.draft.smtp.password='';S.showPw=false;}
      DB[k]=d; S.errs[k]={};
      render('#spTitle');
      App.toast(T(k==='general'?'set.saved.restart':'set.saved',{s:T('set.s.'+k)}));
    },650);
  }

  $('#sbSave').addEventListener('click',save);

  function setField(el){
    var k=S.sec, D=S.draft[k], f=el.dataset.f, v;

    if(S.errs[k]&&S.errs[k][f]){validate(k);var e=S.errs[k][f],p=$('#e-'+f.replace(/\./g,'-'));

  }
  function toggleArr(el){
    var D=S.draft[S.sec], a=D[el.dataset.arr], v=isNaN(el.value)?el.value:Number(el.value);

  document.addEventListener('change',function(e){

    if(!sp.contains(el))return;

    var fk=focusKey(el);

      var D=S.draft.notifications, keys=$$('[data-arr="types"]',sp).map(function(x){return x.value});

    App.dialog({title:isNew?T('set.tpl.addT'):T('set.editX',{x:L(cur.ti)}),size:'lg',form:true,ok:T(isNew?'set.tpl.add':'set.saveBtn'),
      body:dlgField('rTitle',T('set.col.title'),'<input class="input" id="rTitle" maxlength="120" value="'+esc(L(cur.ti))+'" placeholder="'+esc(T('set.tpl.titlePh'))+'">',{req:1})+
        '<div class="fg">'+dlgField('rCat',T('set.col.cat'),'<input class="input" id="rCat" maxlength="50" value="'+esc(cur.cat?L(cur.cat):'')+'" placeholder="'+esc(T('set.tpl.catPh'))+'">',{opt:1})+
        dlgField('rType',T('set.col.type'),'<select class="select" id="rType">'+tyOpts+'</select>',{hint:esc(T('set.tpl.typeH'))})+'</div>'+
        '<div class="field"><label class="lbl" for="rText">'+esc(T('set.tpl.content'))+' <span class="req" aria-hidden="true">*</span></label><textarea class="ta" id="rText" rows="7" maxlength="5000" placeholder="'+esc(T('set.tpl.contentPh'))+'">'+esc(txt)+'</textarea><p class="err" id="rTextE" hidden></p>'+
        '<div class="cnt-r"><p class="hint">'+esc(T('set.tpl.contentH'))+'</p><p class="hint" id="rCnt">'+txt.length+'/5000</p></div></div>'+
        '<label class="check"><input type="checkbox" id="rOn"'+(cur.active?' checked':'')+'><span>'+esc(T('set.tpl.activeL'))+'</span></label>',
      init:function(w){$('#rText',w).addEventListener('input',function(e){$('#rCnt',w).textContent=e.target.value.length+'/5000'});},
      onOk:function(w){
        var ti=$('#rTitle',w).value.trim(), tx=$('#rText',w).value.trim();
        var ok=fErr(w,'rTitle',ti?'':T('set.v.req'));ok=fErr(w,'rText',tx?'':T('set.v.req'))&&ok;
        if(!ok){$('[aria-invalid="true"]',w).focus();return false;}
        var o={ti:ti,cat:$('#rCat',w).value.trim()||null,ty:$('#rType',w).value||null,tx:tx,active:$('#rOn',w).checked};
        if(isNew){o.id='r'+Date.now();DB.templates.unshift(o);}else Object.keys(o).forEach(function(x){t[x]=o[x]});
        S.touched=true;render();App.toast(T(isNew?'set.added':'set.updated',{x:ti}));
      }});
  }
  function delItem(kind,id){
    var list=DB[kind], it=byId(list,id); if(!it)return;
    var n=L(it.n||it.ti);
    if(it.u>0){
      App.dialog({title:T('set.inUse.t',{x:n}),size:'sm',body:'<p>'+App.fill('set.inUse.d',{n:'<b>'+esc(T('set.nTasks',{n:it.u}))+'</b>'})+'</p>'+
        '<p><a class="lnk" href="tasks-list.html" style="margin:0">'+esc(T('set.inUse.see',{n:it.u}))+'</a></p>'});
      return;
    }
    if(kind==='priorities'&&it.def){App.dialog({title:T('set.pri.defDelT'),size:'sm',body:'<p>'+esc(T('set.pri.defDelD'))+'</p>'});return;}
    App.confirm({title:T('set.delQ',{x:n}),text:T(kind==='templates'?'set.delD.tpl':'set.delD'),ok:T('set.del'),danger:true,onOk:function(){
      list.splice(list.indexOf(it),1);S.touched=true;render('#spTitle');App.toast(T('set.deleted',{x:n}));
    }});
  }
  /* ---------- Soạn mẫu email (thay accordion V1) ---------- */
  var SAMPLE={taskTitle:T('set.em.sTitle'),userName:'Lê Minh',deadline:'28/10/2026',createdAt:'22/10/2026',taskUrl:'#'};
  function fillVars(s){return s.replace(/\{\{(\w+)\}\}/g,function(m,k){return SAMPLE[k]!=null?esc(SAMPLE[k]):m})}
  function editEmail(key){
    var e=DB.emails.filter(function(x){return x.key===key})[0], tab='edit';
    SAMPLE.taskTitle=T('set.em.sTitle');
    function bodyHtml(){
      return dlgField('eSub',T('set.em.subject'),'<input class="input mono" id="eSub" value="'+esc(L(e.sub))+'">',{req:1})+
        '<div class="vars" aria-label="'+esc(T('set.em.vars'))+'">'+['taskTitle','userName','deadline','createdAt','taskUrl'].map(function(v){return '<button type="button" class="chip" data-var="{{'+v+'}}" title="'+esc(T('set.em.insert'))+'">{{'+v+'}}</button>'}).join('')+'</div>'+
        '<p class="hint" style="margin-bottom:16px">'+esc(T('set.em.varsH'))+'</p>'+
        '<div class="field"><div class="ed-top"><label class="lbl" for="eBody">'+esc(T('set.em.body'))+'</label><div class="seg" role="group" aria-label="'+esc(T('set.em.view'))+'"><button type="button" data-etab="edit" aria-pressed="true">'+esc(T('set.em.edit'))+'</button><button type="button" data-etab="prev" aria-pressed="false">'+esc(T('set.em.prev'))+'</button></div></div>'+
        '<textarea class="ta code" id="eBody" spellcheck="false">'+esc(L(e.body))+'</textarea><iframe class="prev" id="ePrev" sandbox="" title="'+esc(T('set.em.prev'))+'" hidden></iframe><p class="err" id="eBodyE" hidden></p></div>'+
        (e.custom?'<button type="button" class="btn-link" id="eReset" style="margin-left:-6px">'+ic('rotate','i-xs')+'<span>'+esc(T('set.em.reset'))+'</span></button>':'<p class="hint">'+esc(T('set.em.isDefault'))+'</p>');
    }
    App.dialog({title:T('set.nt.'+key),sub:esc(T('set.em.dlgSub')),size:'lg',form:true,ok:T('set.em.save'),body:bodyHtml(),
      init:function(w){
        var last=null;
        w.addEventListener('focusin',function(ev){if(ev.target.id==='eSub'||ev.target.id==='eBody')last=ev.target;});
        w.addEventListener('click',function(ev){
          var b=ev.target.closest('[data-etab]');
          if(b){tab=b.dataset.etab;$$('[data-etab]',w).forEach(function(x){x.setAttribute('aria-pressed',x===b)});
            var ta=$('#eBody',w),fr=$('#ePrev',w);ta.hidden=tab!=='edit';fr.hidden=tab==='edit';
            if(tab!=='edit')fr.srcdoc='<!doctype html><meta charset="utf-8"><body style="font:14px/1.6 system-ui,sans-serif;color:#0F1729;margin:16px"><p style="font-size:12px;color:#8892A6;margin:0 0 12px">'+esc(T('set.em.subject'))+': '+fillVars(esc($('#eSub',w).value))+'</p>'+fillVars(ta.value)+'</body>';
            return;}
          var v=ev.target.closest('[data-var]');
          if(v){var t=last||$('#eBody',w);if(t.hidden)t=$('#eSub',w);var s=t.selectionStart||t.value.length;t.value=t.value.slice(0,s)+v.dataset.var+t.value.slice(t.selectionEnd||s);t.focus();t.setSelectionRange(s+v.dataset.var.length,s+v.dataset.var.length);return;}
          if(ev.target.closest('#eReset')){App.confirm({title:T('set.em.resetQ'),text:T('set.em.resetD'),ok:T('set.em.resetOk'),onOk:function(){
            var fresh=build().emails.filter(function(x){return x.key===key})[0];e.sub=fresh.sub;e.body=fresh.body;e.custom=false;S.touched=true;render();
            App.toast(T('set.em.resetDone'));w.querySelector('[data-dlg-x]').click();}});}
        });
      },
      onOk:function(w){
        var s=$('#eSub',w).value.trim(), b=$('#eBody',w).value.trim();
        var ok=fErr(w,'eSub',s?'':T('set.v.req'));ok=fErr(w,'eBody',b?'':T('set.v.req'))&&ok;
        if(!ok){if(!b){$('[data-etab="edit"]',w).click();}$('[aria-invalid="true"]',w).focus();return false;}
        e.sub=s;e.body=b;e.custom=true;S.touched=true;render();App.toast(T('set.updated',{x:T('set.nt.'+key)}));
      }});
  }

  /* ---------- Bấm ---------- */
  document.addEventListener('click',function(e){
    var el;
    if((el=e.target.closest('[data-sec]'))){e.preventDefault();$('#app').classList.remove('nav-open');go(el.dataset.sec);return;}
    if(!e.target.closest('#sp'))return;
    if(e.target.closest('[data-retry]')){load(800);return;}
    if((el=e.target.closest('[data-add]'))){({priorities:editPriority,types:editType,templates:editTemplate})[el.dataset.add]();return;}
    if((el=e.target.closest('[data-edit]'))){var p=el.dataset.edit.split(':'),it=byId(DB[p[0]],p[1]);({priorities:editPriority,types:editType,templates:editTemplate})[p[0]](it);return;}
    if((el=e.target.closest('[data-del]'))){var q=el.dataset.del.split(':');delItem(q[0],q[1]);return;}
    if((el=e.target.closest('[data-more]'))){
      var t=byId(DB.templates,el.dataset.more);
      App.menu(el,App.mi('toggle',t.active?'eye-off':'eye',T(t.active?'set.tpl.hide':'set.tpl.show'))+'<hr>'+App.mi('del','trash',T('set.del'),{danger:1}),function(m){
        if(m.dataset.mi==='toggle'){t.active=!t.active;S.touched=true;render();App.toast(T(t.active?'set.tpl.shown':'set.tpl.hidden',{x:L(t.ti)}));}
        else delItem('templates',t.id);
      });
      return;
    }
    if((el=e.target.closest('[data-email]'))){editEmail(el.dataset.email);return;}
    if((el=e.target.closest('[data-nf]'))){S.nf=el.dataset.nf;render('[data-nf="'+S.nf+'"]');return;}
    if((el=e.target.closest('[data-wk]'))){
      var D=S.draft[S.sec],a=D.sendDays,all=WEEKDAYS.every(function(d){return a.indexOf(d)>-1});
      D.sendDays=all?a.filter(function(d){return WEEKDAYS.indexOf(d)<0}):a.concat(WEEKDAYS.filter(function(d){return a.indexOf(d)<0}));
      render('[data-wk]');return;
    }
    if(e.target.closest('[data-rcpall]')){
      var Dg=S.draft.digest,q2=S.rq.trim().toLowerCase(),vis=USERS.filter(function(u){return u.e&&(!q2||(u.n+' '+u.e).toLowerCase().indexOf(q2)>-1)}).map(function(u){return u.c});
      var allS=vis.every(function(c){return Dg.recipientIds.indexOf(c)>-1});
      Dg.recipientIds=allS?Dg.recipientIds.filter(function(c){return vis.indexOf(c)<0}):Dg.recipientIds.concat(vis.filter(function(c){return Dg.recipientIds.indexOf(c)<0}));
      render('[data-rcpall]');return;
    }
    if(e.target.closest('[data-pw]')){S.showPw=!S.showPw;render('[data-pw]');return;}
    if(e.target.closest('#secReset')){
      App.confirm({title:T('set.sec.resetQ'),text:T('set.sec.resetD'),ok:T('set.sec.resetOk'),onOk:function(){
        S.draft.security=clone(SEC_DEFAULT);S.errs.security={};render('#secReset');
        App.toast(dirty()?T('set.sec.resetDone'):T('set.sec.resetSame'),'info');
      }});
      return;
    }
    if(e.target.closest('#dgTest')){
      var to=$('#dgTo').value.trim(), okM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to), pe=$('#dgToE'), inp=$('#dgTo');
      if(!okM){pe.hidden=false;pe.innerHTML=ic('alert','i-xs')+'<span>'+esc(T(to?'set.v.mail':'set.v.req'))+'</span>';inp.setAttribute('aria-invalid','true');inp.setAttribute('aria-describedby','dgToE');inp.focus();return;}
      S.dgTesting=true;render('#dgTest');
      setTimeout(function(){S.dgTesting=false;render();App.toast(T('set.dg.sent',{e:to}));},900);
      return;
    }
    if(e.target.closest('#smTest')){
      S.smtpTesting=true;S.smtpRes=null;render('#smTest');
      setTimeout(function(){
        S.smtpTesting=false;
        var u=USERS.filter(function(x){return x.c===S.smtpTo})[0], now=new Date(), tm=pad(now.getHours())+':'+pad(now.getMinutes());
        S.smtpRes=S.pvSmtp==='ok'?{k:'ok',h:App.fill('set.sm.okRes',{e:'<b>'+esc(u.e)+'</b>',t:'<span class="mono">'+tm+'</span>'})}
          :{k:'bad',h:'<b>'+esc(T('set.sm.badT'))+'</b> '+App.fill('set.sm.badRes',{h:'<span class="mono">'+esc(DB.smtp.host+':'+DB.smtp.port)+'</span>'})};
        render('#smTest');
      },1000);
      return;
    }
  });
  document.addEventListener('keydown',function(e){
    if(App.dialogOpen())return;
    var r=e.target.closest&&e.target.closest('.tr[data-email]');
    if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();editEmail(r.dataset.email);}
  });

  /* ---------- Thanh preview ---------- */
  function pv(){
    var s=sec(S.sec), canDirty=s&&s.form&&!isRO(S.sec)&&allowed(s);
    var cur=S.screen==='normal'&&dirty()?'dirty':S.screen;
    var h='<label class="pvl" for="pvScreen">'+esc(T('set.pv.screen'))+'</label><select id="pvScreen">'+
      opt('normal',T('set.pv.normal'),cur)+opt('loading',T('set.pv.loading'),cur)+opt('error',T('set.pv.error'),cur)+opt('dirty',T('set.pv.dirty'),cur,!canDirty)+'</select>';
    if(S.sec==='smtp'&&role()==='ADMIN')h+='<label class="pvl" for="pvSmtp">'+esc(T('set.pv.smtp'))+'</label><select id="pvSmtp">'+opt('ok',T('set.pv.smtpOk'),S.pvSmtp)+opt('fail',T('set.pv.smtpFail'),S.pvSmtp)+'</select>';
    return h;
  }
  /* mẫu "có thay đổi chưa lưu" cho từng mục form */
  var DIRTY_SAMPLE={
    notifications:function(D){var i=D.types.indexOf('COMMENT_ADDED');if(i<0)D.types.push('COMMENT_ADDED');else D.types.splice(i,1);},
    digest:function(D){D.sendHour=D.sendHour===7?8:7;},
    overdue:function(D){if(D.sendDays.indexOf(6)<0)D.sendDays.push(6);else D.sendDays.splice(D.sendDays.indexOf(6),1);},
    smtp:function(D){D.fromName=D.fromName==='TechOps PMH'?'TechOps':'TechOps PMH';},
    security:function(D){D.rateLimit.lockoutMinutes=D.rateLimit.lockoutMinutes===30?15:30;},
    general:function(D){D.timezone=D.timezone==='Asia/Ho_Chi_Minh'?'Asia/Bangkok':'Asia/Ho_Chi_Minh';}
  };
  function pvScreen(v){
    if(v==='dirty'){S.screen='normal';discard(S.sec);DIRTY_SAMPLE[S.sec](S.draft[S.sec]);render();}
    else if(v==='normal'){S.screen='normal';discard(S.sec);render();}
    else{S.screen=v;render();}
    App.refreshPv();var p=$('#pvScreen');p&&p.focus();
  }

  /* ---------- Khởi động ---------- */
  App.shell({active:'settings',crumbs:[{t:'nav.settings'}],pv:pv});
  I18N.apply($('#content'));
  document.addEventListener('langchange',function(){
    if(!S.touched&&!SECS.some(function(s){return dirty(s.k)})){DB=build();S.draft=freshDrafts();}
    I18N.apply($('#content'));render();App.refreshPv();
  });
  document.addEventListener('rolechange',function(){
    SECS.forEach(function(s){if(s.form)discard(s.k)});
    if(!allowed(sec(S.sec))){S.sec=firstAllowed();history.replaceState(null,'','#'+S.sec);}
    render();App.refreshPv();
  });
  var start=(location.hash||'').slice(1);
  S.sec=sec(start)?start:firstAllowed();
  if(!start)history.replaceState(null,'','#'+S.sec);
  load(420);
})();
</script>
</body>
</html>
