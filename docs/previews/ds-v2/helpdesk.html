<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechOps · Helpdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Noto+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ---------- Riêng trang Helpdesk ---------- */
/* Khu đồng bộ (Vice Manager/Admin) */
.sync{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:10px 12px 10px 16px;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.sy-main{flex:1 1 320px;min-width:0;display:flex;align-items:flex-start;gap:10px}
.sy-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px;background:var(--c-done)}
.sy-dot.run{background:var(--primary);animation:pulse 1.2s ease-in-out infinite}
.sy-dot.bad{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.sy-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.sy-tx b{font-weight:600;font-size:var(--fs-md);color:var(--ink)}
.sy-tx span{font-size:var(--fs-sm);color:var(--ink-2);overflow-wrap:anywhere}
.sy-tx .bad{color:var(--danger)}
.sy-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.sy-act .btn-ghost{color:var(--ink-2)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Hàng điều khiển */
.ctl{display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.ctl .tabs{flex:1}
.tools{display:flex;align-items:center;gap:8px;padding-bottom:8px;flex:none}
.tb-search{width:240px}
.fchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 14px}
/* Thanh hàng loạt */
.bulk{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 10px 8px 16px;margin:0 0 12px;background:var(--primary-soft);border-radius:var(--r-ctl);font-size:var(--fs-sm)}
.bulk b{font-weight:600;color:var(--ink);margin-right:auto}
.bulk .btn{background:var(--surface)}
/* Bảng */
.tbl{--cols:minmax(0,1fr) 156px 132px 148px 92px 16px}
.tr{min-height:48px;padding-top:5px;padding-bottom:5px}
.th .ck,.c-tk .ck{display:inline-grid;place-items:center;width:28px;height:28px;margin:0 6px 0 -8px;flex:none;border-radius:6px;cursor:pointer}
.ck input{width:16px;height:16px;margin:0;accent-color:var(--primary);cursor:pointer}
.ck.ph{cursor:default}
.tt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;width:100%}
.tt .l1{display:flex;align-items:center;gap:6px;min-width:0;width:100%}
.tt .l2{display:flex;align-items:center;gap:10px;min-width:0}
.tt .code{font-size:var(--fs-xs);color:var(--ink-3);flex:none}
.tt .tx{font-size:var(--fs-md);font-weight:500;line-height:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr.pushed .tt .tx{color:var(--ink-2);font-weight:400}
.attn-i{display:inline-flex;color:var(--danger);flex:none}
.tlink{display:inline-flex;align-items:center;gap:4px;flex:none;font:500 12px/1 var(--f-mono);color:var(--c-done);text-decoration:none;padding:3px 4px;margin:-3px -4px;border-radius:6px}
.tlink:hover{background:var(--surface-2);text-decoration:underline;text-underline-offset:3px}
.rq{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.rq b{font-weight:400;font-size:var(--fs-sm);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rq small{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-st{gap:8px;font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap}
.c-st span:last-child{overflow:hidden;text-overflow:ellipsis}
.hs-done{--k:var(--c-done)} .hs-progress{--k:var(--c-progress)} .hs-pending{--k:var(--c-review)}
.hs-approved{--k:var(--c-approval)} .hs-rejected{--k:var(--danger)} .hs-closed{--k:var(--c-draft)}
.c-as{gap:8px;font-size:var(--fs-sm);color:var(--ink);min-width:0}
.c-as .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-as .nm.ext{color:var(--ink-2)}
.unas{font-size:var(--fs-sm);color:var(--ink-3)}
.c-at{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.c-chev{color:var(--ink-3);justify-content:flex-end}
.tr:hover .c-chev{color:var(--ink-2)}
.tr.on{background:color-mix(in srgb,var(--primary-soft) 55%,var(--surface))}
.skr .sk{max-width:100%}
/* Phân trang */
.pg{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:var(--fs-sm);color:var(--ink-2)}
.pg .mono{color:var(--ink)}
.pg .sp{flex:1}
.pg select{width:auto;height:32px;font-size:var(--fs-sm);padding-right:30px}
.pg-n{display:flex;gap:4px}
/* Ngăn chi tiết ticket */
.dr-b .note{margin:0 0 22px}
.note .lk{color:var(--primary);font-weight:500;text-decoration:none;white-space:nowrap}
.note .lk:hover{text-decoration:underline}
.dr-f .grow{flex:1}
.kv dd small{flex-basis:100%}
/* Lịch sử đồng bộ */
.hl{list-style:none;margin:0;padding:0}
.hl>li{padding:14px 0;border-bottom:1px solid var(--line)}
.hl>li:first-child{padding-top:0}
.hl>li:last-child{border-bottom:0}
.hl-h{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm)}
.hl-h b{font-weight:600;color:var(--ink)}
.hl-h .mono{margin-left:auto;color:var(--ink-2);font-size:var(--fs-xs)}
.m-auto{--k:var(--c-progress)} .m-manual{--k:var(--c-approval)}
.hl-n{margin:4px 0 0 16px;font-size:var(--fs-sm);color:var(--ink-2)}
.hl-n b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.hl-err{margin:6px 0 0 10px}
.hl-err .btn-link{color:var(--danger)}
.hl-err .btn-link:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.hl-err .i.r{transition:transform .15s}
.hl-err [aria-expanded="true"] .i.r{transform:rotate(90deg)}
.hl-e{list-style:none;margin:6px 0 0 6px;padding:0;display:flex;flex-direction:column;gap:4px}
.hl-e li{font-size:var(--fs-xs);color:var(--ink-2);padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-2);overflow-wrap:anywhere}
.hl-e .mono{color:var(--ink)}
.dr-sub{font-size:var(--fs-sm);color:var(--ink-3);margin:-14px 0 20px}
.dr-h h2{margin:0 0 0 4px;font:600 var(--fs-md)/1.3 var(--f-head)}
/* Lịch tự động */
.slot{padding:14px 0;border-bottom:1px solid var(--line)}
.slot:first-child{padding-top:4px}
.slot .row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px 16px}
.slot .check{font-weight:500}
.slot .field{margin:10px 0 0 26px;width:140px}
.slot.off .field{opacity:.5}
.cron-sum{margin:14px 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.cron-sum b{color:var(--ink);font-weight:600}
.cron-last{margin:6px 0 0;font-size:var(--fs-xs);color:var(--ink-3)}
/* OTP */
.otp{font:500 22px/1 var(--f-mono);letter-spacing:.4em;text-align:center;height:48px;max-width:220px;padding-left:.4em}
.dlg-b .kvs{margin:0 0 14px;padding:0;list-style:none;font-size:var(--fs-sm);color:var(--ink-2)}
.dlg-b .kvs li{display:flex;gap:8px;padding:3px 0}
.dlg-b .kvs li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);margin-top:8px;flex:none}
/* Nhập dữ liệu: nhiều bước */
.steps{display:flex;gap:6px;margin:2px 0 16px;padding:0;list-style:none;font-size:var(--fs-xs);color:var(--ink-3);flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:6px}
.steps li+li::before{content:"";width:16px;height:1px;background:var(--line-2)}
.steps .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);font:500 11px/1 var(--f-mono)}
.steps [aria-current="step"]{color:var(--ink);font-weight:500}
.steps [aria-current="step"] .n{border-color:var(--primary);color:var(--primary)}
.steps .ok .n{background:var(--surface-2);border-color:var(--surface-2);color:var(--ink-2)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.src label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line-2);border-radius:var(--r-ctl);cursor:pointer;min-width:0}
.src label:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.src input{margin:3px 0 0;accent-color:var(--primary);flex:none}
.src b{display:block;font-weight:500;font-size:var(--fs-md)}
.src small{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px;line-height:1.45}
.ta.json{height:auto;min-height:170px;padding:8px 10px;font:400 12px/1.55 var(--f-mono);resize:vertical}
.busy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 8px;color:var(--ink-2);font-size:var(--fs-sm)}
.busy .i{width:28px;height:28px;color:var(--primary)}
.busy b{font-weight:500;color:var(--ink);font-size:var(--fs-md)}
.sum{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--line);border-radius:var(--r-ctl)}
.sum li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:var(--fs-sm);color:var(--ink-2)}
.sum li:last-child{border-bottom:0}
.sum .sdot{margin:0 2px}
.sum span.t{flex:1;min-width:0}
.sum span.t b{display:block;font-weight:500;color:var(--ink);font-size:var(--fs-md)}
.sum .v{font:500 var(--fs-md)/1 var(--f-mono);color:var(--ink)}
.k-new{--k:var(--c-done)} .k-wait{--k:var(--c-review)} .k-dup{--k:var(--c-draft)} .k-err{--k:var(--danger)}
.dlg-f .back{margin-right:auto}
/* Phase B: phần cần backend mới / đổi logic so với V1 (tạm, chờ app.css có .pb-zone) */
.pb-zone{outline:1px dashed color-mix(in srgb,var(--amber) 70%,transparent);outline-offset:2px;border-radius:var(--r-sm)}
.phase-b.pb-s{height:16px;padding:0 4px;margin-left:4px}
.tab.pb-zone{outline:1px dashed color-mix(in srgb,var(--amber) 70%,transparent);outline-offset:2px;border-radius:var(--r-sm)}
.imp-b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0;font-size:var(--fs-xs);color:var(--ink-3)}
.err-box{margin:0 0 14px;padding:10px 12px;border-radius:var(--r-ctl);background:var(--surface-2);font:400 12px/1.5 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}

@media (max-width:1399px){
  .ctl{display:block;border-bottom:0}
  .tabs{border-bottom:1px solid var(--line)}
  .tools{padding:12px 0 0}
  .tb-search{flex:1;width:auto;max-width:360px}
}
@media (max-width:1023px){
  .tbl{--cols:minmax(0,1fr) 132px 112px 120px 78px 12px}
  .thead,.tr{column-gap:14px;padding:0 12px 0 16px}
}
@media (max-width:680px){
  .ctl .tabs{gap:18px;margin:0 -16px;padding:0 28px 0 16px;border-bottom:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
  .tools{border-top:1px solid var(--line)}
  .tb-search{max-width:none}
  .tools .btn-q span{display:none}
  .tools .btn-q{padding:0 10px}
  .sync{padding:12px}
  .sy-main{flex-basis:100%}
  .sy-act{margin-left:0;width:100%}
  .sy-act .btn-p{margin-left:auto}
  .tr{padding:12px 16px}
  .tt .l1{align-items:flex-start}
  .tt .l1 .attn-i,.tt .l1 .flag{margin-top:3px}
  .tt .tx{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .c-tk{align-items:flex-start}
  .c-tk .ck{margin-top:-4px}
  .rq small{display:none}
  .c-req{max-width:42%}
  .c-as .nm{display:none}
  .c-as .unas{display:none}
  .c-st,.c-at,.rq b{font-size:var(--fs-xs)}
  .tr .c-req,.tr .c-st,.tr .c-at{margin-left:0}
  .tr .c-req{padding-left:30px}
  .tr.emp .c-req{padding-left:0}
  .bulk{padding:8px 10px}
  .bulk b{flex-basis:100%}
  .bulk .btn{flex:1}
  .pg .sp{display:none}
  .pg-n{margin-left:auto}
  .src{grid-template-columns:1fr}
  .slot .field{width:auto;margin-left:26px}
}
</style>
</head>
<body data-no-pvbar>
<main class="content" id="content">
  <div class="head">
    <div>
      <h1 data-t="hd.title"></h1>
      <p id="sub"></p>
    </div>
    <div class="head-act" id="headAct"></div>
  </div>

  <section class="sync boss-only" id="sync" data-t-label="hd.sync.label"></section>

  <div class="ctl">
    <div class="tabs" role="tablist" id="tabs" data-t-label="hd.tabs"></div>
    <div class="tools">
      <label class="search tb-search"><i data-i="search" class="i-sm"></i><span class="sr" data-t="hd.search"></span><input type="search" id="q" data-t-ph="hd.search"></label>
      <button type="button" class="btn btn-q" id="fBtn" data-hd="filter"><i data-i="filter" class="i-xs"></i><span data-t="filter.btn"></span></button>
    </div>
  </div>
  <div class="fchips" id="fchips" hidden></div>
  <div class="bulk" id="bulk" role="region" hidden></div>

  <div id="listWrap"></div>
  <div class="pg" id="pg" hidden></div>
</main>

<script src="ds.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

  function mergeIncoming(){
    var r={synced:0,pending:0,skipped:TK.length,fetched:TK.length,err:[]};
    INCOMING.forEach(function(x){
      r.fetched++;
      if(byHd(x.hd)){r.skipped++;return;}
      var t=clone(x),k=match(t.it); t.imp=t.upd=DATA.TODAY+' '+new Date().toTimeString().slice(0,5);
      if(t.st==='done'&&k){pushTicket(t,k);r.synced++;}else r.pending++;
      TK.push(t);
    });
    return r;
  }

  /* phân tích dữ liệu dán tay giống syncFromData + processTickets(skipExisting=false): mảng hoặc {success,data}, tối đa 500 */
  function key(o,names){for(var k in o){var f=fold(k).replace(/[^a-z]/g,'');for(var i=0;i<names.length;i++)if(f===names[i])return o[k]==null?'':String(o[k]).trim()}return ''}
  /* không có Code → hdId tự sinh như extractHdId() của V1 (ticket-task-creator.service.ts:16) */
  function hdIdOf(title,ts){var slug=title.replace(/\s+/g,'-').substring(0,20).replace(/[^a-zA-Z0-9-]/g,''),d=ts?Date.parse(ts.replace(' ','T')):NaN;return ('HD-'+slug+'-'+(isNaN(d)?Date.now():d).toString(36)).substring(0,50)}
  function analyse(raw){
    var arr=Array.isArray(raw)?raw:(raw&&typeof raw==='object'&&Array.isArray(raw.data)?raw.data:null);
    if(!arr)return {bad:'shape'};
    if(arr.length>500)return {bad:'big',n:arr.length};
    var r={total:arr.length,neu:[],wait:[],dup:[],err:[],items:[]};
    arr.forEach(function(o,i){
      if(!o||typeof o!=='object'){r.err.push({hd:'#'+(i+1),m:T('hd.imp.e.row')});return;}
      var code=key(o,['code']), title=key(o,['tieude']), st=fold(key(o,['trangthai'])), it=key(o,['itsupport'])||null;
      if(!title){r.err.push({hd:code||'#'+(i+1),m:T('hd.imp.e.title')});return;}
      var hd=code||hdIdOf(title,key(o,['timestamp'])), done=st==='hoan thanh'||st==='completed', ex=byHd(hd);
      var item={hd:hd,title:title,done:done,it:it,req:key(o,['nhanvien'])||'—',at:key(o,['ngaytao'])};
      if(ex&&(ex.sys==='PUSHED'||!done)){r.dup.push(item);return;}
      if(done&&match(it))r.neu.push(item);else r.wait.push(item);
    });
    return r;
  }

    if(res)return '<ul class="sum">'+li('k-new',T('hd.imp.r.new'),T('hd.imp.r.newD'),res.synced)+li('k-wait',T('hd.imp.r.wait'),T('hd.imp.r.waitD'),res.pending)+li('k-dup',T('hd.imp.r.dup'),T('hd.imp.r.dupD'),res.skipped)+(res.err.length?li('k-err',T('hd.imp.r.err'),'',res.err.length):'')+'</ul>';
    return '<ul class="sum">'+li('k-new',T('hd.imp.p.new'),T('hd.imp.p.newD'),r.neu.length)+li('k-wait',T('hd.imp.p.wait'),T('hd.imp.p.waitD'),r.wait.length)+
      li('k-dup',T('hd.imp.p.dup'),T('hd.imp.p.dupD'),r.dup.length)+li('k-err',T('hd.imp.p.err'),T('hd.imp.p.errD'),r.err.length)+'</ul>'+
      (r.err.length?'<ul class="hl-e" style="margin:0 0 14px">'+r.err.map(function(e){return '<li><span class="mono">'+esc(e.hd)+'</span> — '+esc(e.m)+'</li>'}).join('')+'</ul>':'');
  }
  function dlgImport(start){
    /* V1 (ManualImportCard + nút "Get từ API"): bấm là NHẬP NGAY → hiện kết quả. M.b = luồng "Xem trước" (dry-run) — Phase B, cần API mới */
    var M={step:'src',src:'api',json:'',r:null,res:null,apiFail:false,b:false};
    if(start)for(var k in start)M[k]=start[k];
    function runNow(w){M.step='run';draw(w);setTimeout(function(){if(!document.contains(w))return;M.res=commit(M);M.step='done';draw(w);render();},1100);}
    var api=App.dialog({title:T('hd.imp.title'),size:'lg',form:1,ok:T('hd.imp.next'),body:'',
      init:function(w){draw(w);w.addEventListener('change',function(e){if(e.target.name==='impSrc'){M.src=e.target.value;M.step='src';draw(w);var r=$('input[name=impSrc]:checked',w);if(r)r.focus();}});
        w.addEventListener('input',function(e){if(e.target.id==='impJson'){M.json=e.target.value;if(M.jsonErr){M.jsonErr='';setErr(e.target,'');}}});
        w.addEventListener('click',function(e){var b=e.target.closest('[data-imp]');if(!b)return;var a=b.dataset.imp;
          if(a==='back'){M.step='src';M.b=false;draw(w);}
          if(a==='check'){M.b=true;$('[data-dlg-ok]',w).click();}
          if(a==='toJson'){M.src='json';M.step='src';M.b=false;draw(w);var t=$('#impJson',w);if(t)t.focus();}
          if(a==='sample'){M.json=SAMPLE_JSON;M.jsonErr='';draw(w);$('#impJson',w).focus();}
        });},
      onOk:function(w){
        if(M.step==='src'||M.step==='apiErr'){
          if(M.src==='api'){M.step='fetch';draw(w);setTimeout(function(){if(!document.contains(w))return;
            if(M.apiFail){M.step='apiErr';draw(w);return;}
            if(M.b){M.r=apiPreview();M.step='prev';draw(w);return;}
            M.res=commit(M);M.step='done';draw(w);render();},1300);return false;}
          var v=M.json.trim(); M.jsonErr='';
          if(!v){M.jsonErr=T('hd.imp.e.empty');}
          else{var raw;try{raw=JSON.parse(v)}catch(x){M.jsonErr=T('hd.imp.e.json');}
            if(!M.jsonErr){var r=analyse(raw);if(r.bad==='shape')M.jsonErr=T('hd.imp.e.shape');else if(r.bad==='big')M.jsonErr=T('hd.imp.e.big',{n:r.n});else{M.r=r;if(M.b)M.step='prev';else{runNow(w);return false;}}}}
          if(M.jsonErr)M.b=false;
          draw(w); if(M.jsonErr){var t=$('#impJson',w);if(t)t.focus();} return false;
        }
        if(M.step==='prev'){runNow(w);return false;}
        return true;
      }
    });
    function draw(w){
      var b=$('.dlg-b',w), ok=$('[data-dlg-ok]',w), f=$('.dlg-f',w);
      $$('[data-imp="back"],[data-imp="check"]',f).forEach(function(x){x.remove()});
      ok.hidden=false; ok.disabled=false; ok.className='btn btn-p';
      var h='', B=M.b;
      function backBtn(){var bb=document.createElement('button'); bb.type='button'; bb.className='btn btn-ghost back'; bb.dataset.imp='back'; bb.innerHTML=ic('chev-l','i-sm')+'<span>'+esc(T('hd.imp.back'))+'</span>'; f.insertBefore(bb,f.firstChild);}
      if(M.step==='src'){
        h=stepsHtml('src',B)+'<fieldset style="border:0;margin:0;padding:0"><legend class="lbl" style="padding:0;margin-bottom:6px">'+esc(T('hd.imp.srcL'))+'</legend><div class="src">'+
          '<label><input type="radio" name="impSrc" value="api"'+(M.src==='api'?' checked':'')+'><span><b>'+esc(T('hd.imp.api'))+'</b><small>'+esc(T('hd.imp.apiD'))+'</small></span></label>'+
          '<label><input type="radio" name="impSrc" value="json"'+(M.src==='json'?' checked':'')+'><span><b>'+esc(T('hd.imp.json'))+'</b><small>'+esc(T('hd.imp.jsonD'))+'</small></span></label></div></fieldset>'+
          (M.src==='json'?'<div class="field"><label class="lbl" for="impJson">'+esc(T('hd.imp.jsonL'))+'</label><textarea class="ta json" id="impJson" rows="8" spellcheck="false" aria-describedby="impJsonE impJsonH" placeholder=\'[{ "Code": "260860", "Tiêu đề": "…", "Trạng thái": "Hoàn thành", "IT Support": "…" }]\'>'+esc(M.json)+'</textarea>'+
            '<p class="err" id="impJsonE" hidden></p><p class="hint" id="impJsonH">'+esc(T('hd.imp.jsonH'))+' <button type="button" class="btn-link" data-imp="sample" style="padding:0 4px">'+esc(T('hd.imp.sample'))+'</button></p></div>'
            :'<div class="note">'+ic('info','i-sm')+'<span>'+esc(T('hd.imp.apiNoteV1'))+'</span></div>')+
          '<p class="imp-b">'+esc(T('hd.imp.bNote'))+pb()+'</p>';
        ok.textContent=T(M.src==='api'?'hd.imp.runApi':'hd.imp.runJson');
        var cb=document.createElement('button'); cb.type='button'; cb.className='btn btn-ghost back pb-zone'; cb.dataset.imp='check'; cb.title=T('hd.pb.tip'); cb.innerHTML='<span>'+esc(T('hd.imp.preview'))+'</span>'+pb(1); f.insertBefore(cb,f.firstChild);
      } else if(M.step==='fetch'){
        h=stepsHtml('src',B)+'<div class="busy" role="status">'+ic('refresh','spin')+'<b>'+esc(T('hd.imp.fetching'))+'</b><span>'+esc(T(B?'hd.imp.fetchingD':'hd.imp.fetchingV1'))+'</span></div>';
        ok.textContent=T(B?'hd.imp.fetch':'hd.imp.runApi'); ok.disabled=true;
      } else if(M.step==='apiErr'){
        h=stepsHtml('src',B)+'<div class="note bad" role="alert">'+ic('wifi-off','i-sm')+'<span><b>'+esc(T('hd.imp.apiErrT'))+'</b><br>'+esc(T('hd.imp.apiErrD'))+'</span></div>'+
          '<p class="hint" style="margin:12px 0 6px">'+esc(T('hd.imp.errDetail'))+'</p><div class="err-box">'+esc(T('hd.err.timeout'))+'</div>'+
          '<button type="button" class="btn btn-sm" data-imp="toJson">'+ic('file','i-sm')+'<span>'+esc(T('hd.imp.useJson'))+'</span></button>';
        ok.textContent=T('app.retry');
      } else if(M.step==='prev'){
        var r=M.r;
        h=stepsHtml('prev',true)+'<div class="pb-zone" style="padding:2px 0"><p style="margin:0 0 12px;color:var(--ink-2)">'+esc(r.api?T('hd.imp.prevApi',{n:r.total+r.filtered,f:r.filtered}):T('hd.imp.prevJson',{n:r.total}))+pb()+'</p>'+sumHtml(r)+
          (r.neu.length+r.wait.length?'<div class="note">'+ic('info','i-sm')+'<span>'+esc(T('hd.imp.prevNote'))+'</span></div>':'<div class="note warn">'+ic('info','i-sm')+'<span>'+esc(T('hd.imp.nothing'))+'</span></div>')+'</div>';
        ok.textContent=T('hd.imp.go',{n:r.neu.length+r.wait.length}); ok.disabled=!(r.neu.length+r.wait.length);
        backBtn();
      } else if(M.step==='run'){
        h=stepsHtml(B?'prev':'src',B)+'<div class="busy" role="status">'+ic('refresh','spin')+'<b>'+esc(T('hd.imp.running'))+'</b><span>'+esc(T('hd.imp.runningD'))+'</span></div>';
        ok.textContent=T(M.src==='api'?'hd.imp.runApi':'hd.imp.runJson'); ok.disabled=true;
      } else if(M.step==='done'){
        h=stepsHtml('done',B)+'<div class="note" role="status" style="margin:0 0 14px">'+ic('check-circle','i-sm')+'<span>'+esc(T('hd.imp.doneT'))+'</span></div>'+sumHtml(null,M.res);
        ok.hidden=true;
      }
      b.innerHTML=h;
      if(M.jsonErr){var t=$('#impJson',w);if(t)setErr(t,M.jsonErr);}
      if(window.dsIcons)dsIcons(w);
      var focusT=M.step==='done'||M.step==='prev'||M.step==='apiErr'?$('.note',b)||null:null; if(focusT){focusT.setAttribute('tabindex','-1');focusT.focus({preventScroll:true});}
    }
    return api;
  }
  function commit(M){
    var stamp=DATA.TODAY+' '+new Date().toTimeString().slice(0,5), res;
    if(M.src==='api'){res=mergeIncoming();}
    else{
      res={synced:0,pending:0,skipped:M.r.dup.length,fetched:M.r.total,err:M.r.err.map(function(e){return {hd:e.hd,m:{vi:e.m,en:e.m}}})};
      M.r.neu.concat(M.r.wait).forEach(function(x){
        var ex=byHd(x.hd), t=ex||tk(x.hd,{vi:x.title,en:x.title},{vi:'',en:''},x.req,'adm',x.done?'done':'pending','normal','sw',x.it,(x.at||stamp).slice(0,16));
        t.imp=t.upd=stamp; var k=match(x.it);
        if(x.done&&k){pushTicket(t,k);res.synced++;}else res.pending++;
        if(!ex)TK.push(t);
      });
    }
    res.mode='manual'; res.at=stamp; S.hist.unshift(res); S.last=res; S.sync='ok';
    App.toast(T('hd.toast.imported',{r:counts(res)}),'success');
    return res;
  }

  /* ---------- Đặt lại dữ liệu: OTP 2 bước ---------- */
  function dlgReset(){
    var step=1, nTask=TK.filter(VIEWS.pushed).length+41, nT=TK.length;
    App.dialog({title:T('hd.reset.title'),size:'sm',form:1,ok:T('hd.reset.send'),danger:1,
      body:'',init:function(w){draw(w);},
      onOk:function(w){
        var ok=$('[data-dlg-ok]',w);
        if(step===1){ok.disabled=true;ok.textContent=T('hd.reset.sending');setTimeout(function(){if(!document.contains(w))return;step=2;draw(w);App.toast(T('hd.reset.sent',{e:S.adminEmail}),'info');$('#otp',w).focus();},900);return false;}
        var inp=$('#otp',w), v=inp.value.trim();
        if(!/^\d{6}$/.test(v)){setErr(inp,T('hd.reset.e6'));inp.focus();return false;}
        if(v==='000000'){setErr(inp,T('hd.reset.eBad'));inp.select();return false;}
        App.toast(T('hd.reset.done',{t:nTask,p:nT}),'success');TK=[];S.sel={};if(App.drawer.isOpen())App.drawer.close();render();
      }
    });
    function draw(w){
      var b=$('.dlg-b',w), ok=$('[data-dlg-ok]',w);
      ok.disabled=false;
      if(step===1){
        b.innerHTML='<div class="note bad">'+ic('alert','i-sm')+'<span>'+esc(T('hd.reset.warn'))+'</span></div>'+
          '<ul class="kvs" style="margin-top:14px"><li>'+esc(T('hd.reset.l1',{n:nTask}))+'</li><li>'+esc(T('hd.reset.l2',{n:nT}))+'</li><li>'+esc(T('hd.reset.l3'))+'</li></ul>'+
          '<p style="margin:0;color:var(--ink-2);font-size:13px">'+App.fill('hd.reset.otpTo',{e:'<b style="color:var(--ink);font-weight:500">'+esc(S.adminEmail)+'</b>'})+'</p>'+
          '<p class="hint" style="margin-top:8px">'+esc(T('hd.reset.adminOnly'))+'</p>';
        ok.textContent=T('hd.reset.send');
      } else {
        b.innerHTML='<p>'+App.fill('hd.reset.step2',{e:'<b style="color:var(--ink);font-weight:500">'+esc(S.adminEmail)+'</b>'})+'</p>'+
          '<div class="field"><label class="lbl" for="otp">'+esc(T('hd.reset.otpL'))+'</label><input class="input otp" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="otpE otpH"><p class="err" id="otpE" hidden></p>'+
          '<p class="hint" id="otpH">'+esc(T('hd.reset.otpH'))+' <button type="button" class="btn-link" data-resend style="padding:0 4px">'+esc(T('hd.reset.resend'))+'</button></p></div>';
        ok.textContent=T('hd.reset.ok');
        var inp=$('#otp',b); inp.addEventListener('input',function(){inp.value=inp.value.replace(/\D/g,'').slice(0,6);if(inp.getAttribute('aria-invalid')==='true')setErr(inp,'');});
        $('[data-resend]',b).addEventListener('click',function(){App.toast(T('hd.reset.sent',{e:S.adminEmail}),'info');inp.focus();});
      }
      if(window.dsIcons)dsIcons(w);
    }
  }

  /* ---------- Thanh preview ---------- */
  var SCREENS=[['data','hd.pv.data'],['loading','hd.pv.loading'],['empty','hd.pv.empty'],['error','hd.pv.error'],['syncing','hd.pv.syncing'],['syncErr','hd.pv.syncErr'],
    ['impPrev','hd.pv.impPrev'],['impApiErr','hd.pv.impApiErr'],['impBad','hd.pv.impBad'],['impDone','hd.pv.impDone']];
  var pvSel='data';
  function pv(){
    return '<label class="pvl" for="pvScreen">'+esc(T('hd.pv.screen'))+'</label><select id="pvScreen">'+SCREENS.map(function(s){
      var bossOnly=['syncing','syncErr','impPrev','impApiErr','impBad','impDone'].indexOf(s[0])>-1;
      return '<option value="'+s[0]+'"'+(s[0]===pvSel?' selected':'')+(bossOnly&&!boss()?' disabled':'')+'>'+esc(T(s[1]))+'</option>'}).join('')+'</select>';
  }
  function closeAllDialogs(){var x;while(App.dialogOpen()&&(x=$('.dlg-wrap:last-of-type [data-dlg-x]')))x.click();}
  function setScreen(v){
    pvSel=v; closeAllDialogs(); if(App.drawer.isOpen())App.drawer.close();
    if(v==='empty'){TK=[];S.screen='data';}
    else{if(!TK.length||S.screen==='loading'||v==='data')seed(); S.screen=v.indexOf('imp')===0?'data':v;}
    if(v==='syncErr')S.syncErr=T('hd.err.timeout');
    S.sel={}; S.page=1; render();
    if(v==='impPrev')dlgImport({step:'prev',src:'api',r:apiPreview(),b:true});
    if(v==='impApiErr')dlgImport({step:'apiErr',src:'api',apiFail:true});
    if(v==='impBad')dlgImport({step:'src',src:'json',json:'[\n  { "Code": "260860", "Tiêu đề": "Cài máy in", "Trạng thái": "Hoàn thành" ',jsonErr:T('hd.imp.e.json')});
    if(v==='impDone'){dlgImport({step:'done',src:'api',res:{synced:3,pending:2,skipped:14,fetched:19,err:[]}});}
  }

  App.shell({active:'helpdesk',crumbs:[{t:'nav.helpdesk'}],title:'hd.title',pv:pv});

  /* ---------- Sự kiện ---------- */
  document.addEventListener('click',function(e){
    var el;
    if(e.target.closest('.dlg-wrap'))return;
    if((el=e.target.closest('[data-stop]'))&&el.closest('.tr')){ if(el.tagName==='A')return; return; }
    if((el=e.target.closest('.tr[data-id]'))){openTicket(el.dataset.id);return;}
    if((el=e.target.closest('[data-tab]'))&&el.closest('#tabs')){e.stopImmediatePropagation();S.view=el.dataset.tab;S.page=1;render();var nt=$('[data-tab="'+S.view+'"]');nt&&nt.focus();return;}
    if((el=e.target.closest('[data-fx]'))){var k=el.dataset.fx;if(k==='all')S.f={p:'',st:'',it:'',from:'',to:''};else S.f[k]='';S.page=1;render();$('#fBtn').focus();return;}
    if((el=e.target.closest('[data-pg]'))){S.page+= +el.dataset.pg;renderList();if(window.dsIcons)dsIcons($('#pg'));var nb=$('[data-pg="'+el.dataset.pg+'"]');if(nb&&!nb.disabled)nb.focus();else $('#pgSize').focus();return;}
    if((el=e.target.closest('[data-herr]'))){var i=+el.dataset.herr;S.histOpen[i]=!S.histOpen[i];App.drawer.set(histHtml());var nb2=$('[data-herr="'+i+'"]');nb2&&nb2.focus();return;}
    if(e.target.closest('#drScrim')){App.drawer.close();return;}
    if(!(el=e.target.closest('[data-hd]')))return;
    var a=el.dataset.hd;
    if(a==='dr-x'){App.drawer.close();return;}
    if(a==='export'){App.toast(T('hd.toast.export',{n:rows().length}),'info');return;}
    if(a==='import'){dlgImport();return;}
    if(a==='more'){App.menu(el,App.mi('push','tasks',T('hd.push.menu'))+App.mi('cron','clock',T('hd.cron.title'))+App.mi('history','history',T('hd.hist.title'))+(admin()?'<hr>'+App.mi('reset','trash',T('hd.reset.menu'),{danger:1}):''),function(m){
      var k=m.dataset.mi;if(k==='push')dlgPushAll();if(k==='cron')dlgCron();if(k==='history')openHist();if(k==='reset'&&admin())dlgReset();});return;}
    if(a==='sync'){runSync();return;}
    if(a==='cron'){dlgCron();return;}
    if(a==='history'){openHist();return;}
    if(a==='filter'){dlgFilter();return;}
    if(a==='reload'){S.screen='loading';render();setTimeout(function(){S.screen='data';pvSel='data';render();App.refreshPv();},700);return;}
    if(a==='create'){dlgCreate(el.dataset.id);return;}
    if(a==='del'){dlgDel([el.dataset.id]);return;}
    if(a==='b-assign'){dlgBulkAssign();return;}
    if(a==='b-create'){dlgBulkCreate();return;}
    if(a==='b-del'){dlgDel(selIds());return;}
    if(a==='b-clear'){S.sel={};render();var c=$('#ckAll');c&&c.focus();return;}
  });
  document.addEventListener('change',function(e){
    var el=e.target;
    if(el.id==='pvScreen'){setScreen(el.value);App.refreshPv();var p=$('#pvScreen');if(p&&!App.dialogOpen())p.focus();return;}
    if(el.id==='pgSize'){S.size=+el.value;S.page=1;renderList();if(window.dsIcons)dsIcons($('#pg'));$('#pgSize').focus();return;}
    if(el.dataset&&el.dataset.ck){S.sel[el.dataset.ck]=el.checked;renderBulk();var r=el.closest('.tr');if(r)r.classList.toggle('on',el.checked);
      var ca=$('#ckAll');if(ca){var pr=pageRows().filter(function(t){return t.sys!=='PUSHED'}),n=pr.filter(function(t){return S.sel[t.hd]}).length;ca.checked=n&&n===pr.length;ca.indeterminate=n>0&&n<pr.length;}
      if(window.dsIcons)dsIcons($('#bulk'));return;}
    if(el.id==='ckAll'){pageRows().forEach(function(t){if(t.sys!=='PUSHED')S.sel[t.hd]=el.checked});renderBulk();renderList();if(window.dsIcons)dsIcons($('#content'));var c=$('#ckAll');c&&c.focus();return;}
  });
  document.addEventListener('keydown',function(e){
    if(App.dialogOpen()||App.drawer.isOpen())return;
    if(e.target.matches&&e.target.matches('input,a'))return;
    var row=e.target.closest&&e.target.closest('.tr[data-id]');
    if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTicket(row.dataset.id);return;}
    if(row&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();var n=e.key==='ArrowDown'?row.nextElementSibling:row.previousElementSibling;if(n)n.focus();return;}
    var tab=e.target.closest&&e.target.closest('#tabs [data-tab]');
    if(tab&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){var m=e.key==='ArrowRight'?tab.nextElementSibling:tab.previousElementSibling;if(m)m.click();}
  });
  $('#q').addEventListener('input',function(e){S.q=e.target.value;S.page=1;renderTabs();renderList();if(window.dsIcons)dsIcons($('#content'));});
  document.addEventListener('langchange',function(){render();refreshDrawer();App.refreshPv();});
  document.addEventListener('rolechange',function(){
    if(!boss()){S.sel={};if(['syncing','syncErr'].indexOf(S.screen)>-1){S.screen='data';}if(pvSel.indexOf('imp')===0||pvSel.indexOf('sync')===0)pvSel='data';closeAllDialogs();}
    render();refreshDrawer();App.refreshPv();
  });
  render();
  setTimeout(function(){S.screen='data';S.boot=false;render();},450);
})();
</script>
